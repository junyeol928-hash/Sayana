id: java-concurrency
title: スレッドと並行処理
status: ready
minutes: 20
summary: 同時に動く複数のスレッドと、共有される1つの状態。競合状態、synchronized・volatile・AtomicInteger、ExecutorService・Future・CompletableFuture、シングルトン Bean のフィールドの危険まで。
goals:
  - スレッドとは何か、Web アプリが「1リクエスト=1スレッド」で動き、Bean を全スレッドで共有することを説明できる
  - count++ が競合状態を起こす理由を「読む・足す・書く」の3ステップで説明できる
  - synchronized・volatile・AtomicInteger の役割の違いを説明し、使い分けられる
  - ExecutorService に仕事を投げ、Future をタイムアウト付きで受け取り、shutdown まで書ける
  - シングルトン Bean に書き換え可能なフィールドを持たせる危険を見抜き、ローカル変数に直せる
samples:
  - title: スレッドを2本動かして join で待つ
    description: |
      配列の前半と後半を別々のスレッドで合計します。`start()` で動き出し、`join()` で終わるまで待ちます。各スレッドは **自分専用の枠** に書くので、取り合いは起きません。
    code: |
      int[] numbers = new int[1000];
      for (int i = 0; i < numbers.length; i++) {
          numbers[i] = i + 1;          // 1〜1000
      }
      long[] partial = new long[2];    // スレッドごとの書き込み先(別々の枠)

      Thread front = new Thread(() -> {
          for (int i = 0; i < 500; i++) partial[0] += numbers[i];
      });
      Thread back = new Thread(() -> {
          for (int i = 500; i < 1000; i++) partial[1] += numbers[i];
      });

      front.start();   // ここで別スレッドが動き出す(run() と書くと今のスレッドで実行されるだけ)
      back.start();
      front.join();    // 終わるまで待つ。消すと、まだ足し終わっていない値を読むことがある
      back.join();

      // ここを変えてみよう:配列の大きさや分け方を変える
      System.out.println("前半 = " + partial[0]);
      System.out.println("後半 = " + partial[1]);
      System.out.println("合計 = " + (partial[0] + partial[1]));
  - title: count++ の割り込みを手で再現する
    description: |
      `count++` は「読む → 1を足す → 書き戻す」の3ステップです。2つのスレッドがこの途中で入れ替わった順番を、1本のスレッドで手で再現すると、加算が1回分消えるのが分かります。
    code: |
      int count = 0;

      // スレッドA と スレッドB が、ほぼ同時に count++ を始めた
      int a = count;      // A: 読む(0)
      int b = count;      // B: 読む(A が書き戻す前なので、やはり 0)
      a = a + 1;          // A: 1 を足す → 1
      b = b + 1;          // B: 1 を足す → 1
      count = a;          // A: 書き戻す → count = 1
      count = b;          // B: 書き戻す → count = 1(A の加算を上書き)

      System.out.println("2回 count++ したのに count = " + count);

      // ここを変えてみよう:A が「読む・足す・書く」を全部終えてから B が読む順に並べ替えると?
  - title: AtomicInteger と synchronized なら必ず合う
    description: |
      4本のスレッドが1万回ずつ数えます。`AtomicInteger` と `synchronized` のどちらでも、毎回ぴったり 40000 になります。素の `int` の `count++` で同じことをすると、**実行するたびに 40000 より小さい値になり得る**(毎回違う)ので、このサンプルには入れていません。
    code: |
      import java.util.concurrent.atomic.AtomicInteger;

      class SyncCounter {
          private int count = 0;
          synchronized void increment() { count++; }  // 1度に1スレッドだけ
          synchronized int get() { return count; }
      }

      AtomicInteger atomic = new AtomicInteger();
      SyncCounter sync = new SyncCounter();

      Runnable task = () -> {
          for (int i = 0; i < 10_000; i++) {
              atomic.incrementAndGet();   // 読む・足す・書くが1操作
              sync.increment();
          }
      };

      Thread[] workers = new Thread[4];
      for (int i = 0; i < workers.length; i++) {
          workers[i] = new Thread(task);
          workers[i].start();
      }
      for (Thread w : workers) {
          w.join();                      // 全員終わるまで待ってから読む
      }

      int expected = 4 * 10_000;
      System.out.println("AtomicInteger : " + atomic.get() + "(期待値と一致: " + (atomic.get() == expected) + ")");
      System.out.println("synchronized  : " + sync.get() + "(期待値と一致: " + (sync.get() == expected) + ")");
  - title: ExecutorService と Future(タイムアウト付き)
    description: |
      3本のスレッドのプールに仕事を投げ、`Future` で結果を受け取ります。結果は **投げた順** に取り出すので、どれが先に終わっても表示の順番は変わりません。後半は、時間のかかる仕事を `get(タイムアウト)` で諦める例です。
    code: |
      import java.util.*;
      import java.util.concurrent.*;

      ExecutorService pool = Executors.newFixedThreadPool(3);
      try {
          List<Future<String>> futures = new ArrayList<>();
          for (String item : List.of("ペン", "ノート", "消しゴム")) {
              futures.add(pool.submit(() -> {
                  Thread.sleep(50);                 // 外部APIの呼び出しのつもり
                  return item + ":" + item.length() * 100 + "円";
              }));
          }
          for (Future<String> f : futures) {
              System.out.println(f.get(1, TimeUnit.SECONDS));   // 投げた順に受け取る
          }

          Future<String> slow = pool.submit(() -> {
              Thread.sleep(5_000);                  // 5秒かかる重い処理
              return "done";
          });
          try {
              System.out.println(slow.get(100, TimeUnit.MILLISECONDS));
          } catch (TimeoutException e) {
              slow.cancel(true);                    // 待つのをやめ、処理にも中断を伝える
              System.out.println("タイムアウトしたので諦めました");
          }
      } finally {
          pool.shutdown();                          // 忘れるとスレッドが残り続ける
          pool.awaitTermination(1, TimeUnit.SECONDS);
      }
      System.out.println("プールは止まった? " + pool.isTerminated());
  - title: CompletableFuture で非同期処理をつなぐ
    description: |
      `supplyAsync` で別スレッドに仕事を任せ、`thenApply`(普通の関数)と `thenCompose`(CompletableFuture を返す関数)でつなぎます。最後の `join()` で完了を待ちます。
    code: |
      import java.util.concurrent.*;

      ExecutorService pool = Executors.newFixedThreadPool(2);

      CompletableFuture<Integer> applyDiscount(int total, ExecutorService pool) {
          // 割引の計算も別スレッドで行う(非同期を返す関数)
          return CompletableFuture.supplyAsync(() -> total >= 1000 ? total - 200 : total, pool);
      }

      int quantity = 3;
      // supplyAsync : 単価を取ってくる(別スレッド)
      // thenApply   : 普通の関数で加工(400 × 3 = 1200)
      // thenCompose : CompletableFuture を返す関数をつなぐ(割引)
      CompletableFuture<Integer> price = CompletableFuture.supplyAsync(() -> 400, pool)
              .thenApply(unit -> unit * quantity)
              .thenCompose(total -> applyDiscount(total, pool));

      // ここを変えてみよう:quantity を 2 にすると割引は?
      System.out.println("支払い = " + price.join() + "円");

      pool.shutdown();
      pool.awaitTermination(1, TimeUnit.SECONDS);
quiz:
  - question: |
      次のコードを実行したときの出力は?
      ```java
      AtomicInteger counter = new AtomicInteger(0);
      Runnable task = () -> {
          for (int i = 0; i < 1000; i++) {
              counter.incrementAndGet();
          }
      };
      Thread t1 = new Thread(task);
      Thread t2 = new Thread(task);
      t1.start(); t2.start();
      t1.join(); t2.join();
      System.out.println(counter.get());
      ```
    choices: ["必ず 2000", "2000 未満になることがある", "必ず 1000", "実行のたびに値がバラバラ(0〜2000)"]
    answer: 0
    explanation: |
      `incrementAndGet()` は「読む・足す・書く」を **割り込まれない1つの操作** として行うので、2つのスレッドが同時に呼んでも加算は消えません。さらに `join()` で両方の終了を待ってから読んでいるので、必ず 2000 です。
      「2000 未満になることがある」のは、素の `int` で `count++` した場合です。`join()` を書き忘れた場合も、途中の値を読んでしまうことがあります。
  - question: |
      複数のスレッドから同時に呼ばれる `count++`(`count` は int のフィールド)がスレッドセーフでない理由は?
    choices: ["int 型は複数スレッドから読めないから", "読む・1を足す・書き戻すの3ステップに分かれていて、途中に別スレッドが割り込めるから", "count++ はコンパイル時に削除されることがあるから", "フィールドはスレッドごとにコピーされて別々の値になるから"]
    answer: 1
    explanation: |
      `count++` は1行に見えても、中では「①読む → ②1を足す → ③書き戻す」です。2つのスレッドが両方とも①で同じ値を読むと、どちらも同じ値を書き戻し、1回分の加算が消えます。これが **競合状態** です。
      int を読むこと自体は問題ありません。フィールドはヒープ上の1つを全スレッドが共有しています(スレッドごとに別々なのはスタック上のローカル変数)。
  - question: |
      次のフィールドを持つクラスの `increment()` を、複数のスレッドが同時に呼ぶ。正しい説明は?
      ```java
      private volatile int count = 0;
      public void increment() { count++; }
      ```
    choices: ["volatile を付けたので完全にスレッドセーフ", "volatile は値の見え方(可視性)を保証するだけで、count++ の3ステップは割り込まれ得る", "volatile を付けたフィールドに ++ はコンパイルエラー", "volatile を付けると count は常に 0 のまま"]
    answer: 1
    explanation: |
      `volatile` が保証するのは「書いた値がほかのスレッドにすぐ見える」ことだけです。`count++` の「読む・足す・書く」を1つの塊にはしないので、加算が消える競合状態はそのまま残ります。
      複数ステップをまとめて守るには `synchronized` か `AtomicInteger` を使います。volatile が向いているのは、停止フラグのような「1回書いて、ほかが読むだけ」の値です。
  - question: |
      Spring の `@Service` クラスに次のフィールドがあった。問題点として正しいのは?
      ```java
      @Service
      public class ItemService {
          private Map<String, Integer> cache = new HashMap<>();
          ...
      }
      ```
    choices: ["問題ない。リクエストごとに新しい ItemService が作られるので", "Bean は既定でアプリ全体に1個だけで全リクエストが共有するため、同時に put すると HashMap が壊れることがある", "HashMap は遅いので ArrayList にするべき", "final が付いていないのでコンパイルエラー"]
    answer: 1
    explanation: |
      Spring の Bean は既定で **シングルトン**(アプリ全体で1個)です。全リクエスト=全スレッドが同じ `ItemService` の同じ `HashMap` を触るので、同時に書き込むと中のデータ構造が壊れることがあります。`ConcurrentHashMap` に変えるか、そもそも状態を Bean に持たない設計にします。
      リクエストごとに作られるわけではありません。final が無くてもコンパイルは通ります(だからこそ気づきにくい)。
  - question: |
      次のコードの出力は?
      ```java
      ExecutorService executor = Executors.newSingleThreadExecutor();
      Future<String> future = executor.submit(() -> {
          Thread.sleep(5000);   // 5秒かかる
          return "done";
      });
      try {
          System.out.println(future.get(1, TimeUnit.SECONDS));
      } catch (TimeoutException e) {
          System.out.println("timeout");
      } finally {
          executor.shutdown();
      }
      ```
    choices: ["done", "timeout", "何も出力されない", "コンパイルエラー"]
    answer: 1
    explanation: |
      処理には5秒かかりますが、`get(1, TimeUnit.SECONDS)` は1秒で待つのをやめて `TimeoutException` を投げます。catch で受けて `timeout` と表示します。
      引数なしの `get()` なら5秒待って `done` を表示します。外部 API が応答しないと永遠に待つことになるので、実務ではタイムアウト付きの `get` が定石です。
columns:
  - type: mistake
    title: タイムアウトなしの get() で、アプリ全体が固まった
    body: |
      ある受注システムで、在庫確認を外部 API に投げるコードがこう書かれていました。

      ```java
      Future<Stock> f = executor.submit(() -> stockApi.check(itemId));
      Stock stock = f.get();   // タイムアウトなし
      ```

      ある日、外部 API 側のサーバーが「接続は受けるが返事をしない」状態になりました。`get()` は結果が来るまで無期限に待つので、リクエストを処理していたスレッドが次々と止まったまま戻らなくなります。Web サーバーのスレッドには上限がある(Spring Boot 既定の Tomcat なら最大200本)ので、全部が待ちで埋まった時点で、在庫と関係ない画面まで一切応答しなくなりました。

      対策は、`f.get(3, TimeUnit.SECONDS)` のように **必ず待つ時間に上限を付ける** こと。タイムアウトしたら `cancel(true)` して、エラー画面や「在庫確認中」の表示に切り替えます。レビューで `get()` や `join()` を見たら、時間制限があるかを真っ先に確認してください。
  - type: genba
    title: 外部装置は「1つずつ順番に」しか受け付けないことがある
    body: |
      鍵の生成に使う HSM(ハードウェアセキュリティモジュール)や古い業務端末など、**同時に1つの接続しか受け付けない** 外部装置があります。Web アプリからは複数のリクエストが同時に来るので、そのまま呼ぶと装置側でエラーになります。

      こういうとき、Service の中に `Executors.newSingleThreadExecutor()`(スレッド1本だけのプール)を持たせ、装置へのアクセスは必ずそこに投げる形にします。何本のリクエストスレッドから呼ばれても、実際に装置に触るのは1本だけで、残りは順番待ちになります。

      現場のコードで `newSingleThreadExecutor` を見かけたら、「ここは直列化したい理由がある」という目印です。うっかり `newFixedThreadPool(4)` に「高速化」すると、装置が詰まって本番障害になります。
  - type: trivia
    title: Java 21 の仮想スレッドで「1リクエスト=1スレッド」が安くなった
    body: |
      これまでの Java のスレッドは OS のスレッドと1対1で、1本ごとに数百KB〜1MB 程度のスタックを確保します。数千本も作ると重いので、Web サーバーはスレッドプールで数を絞ってきました。

      Java 21 で正式に入った **仮想スレッド**(Virtual Threads)は、JVM が管理する軽いスレッドです。待ち(外部 API の応答待ちなど)の間は OS のスレッドを手放すので、何万本作っても平気です。`Thread.ofVirtual().start(...)` や `Executors.newVirtualThreadPerTaskExecutor()` で使えます。Spring Boot 3.2 以降なら `spring.threads.virtual.enabled=true` の1行で、リクエスト処理が仮想スレッドになります。

      ただし、仮想スレッドでも **共有される状態の危険はまったく同じ** です。安くなったのはスレッドの数で、競合状態の対策(この回の内容)は変わりません。

# ローカル版 Java道場から移した教材(scripts/import-local-dojo.mjs で生成。以後は手で直してよい)
- title: "型の当てはめ"
  level: 1
  code: |
    public class Holder<T> {
        private T item;
        public Holder(T item) { this.item = item; }
        public T get() { return item; }
    }

    Holder<Integer> h = new Holder<>(10);
    int doubled = h.get() * 2;
    System.out.println(doubled);
  question: "出力は?"
  choices:
    - "20"
    - "1010"
    - "コンパイルエラー"
    - "ClassCastException"
  answer: 0
  explanation: "Holder なので get() の戻り値は Integer。Integer は自動で int に変換される(アンボクシング)ので * 2 が計算でき、20 になります。T = Integer と当てはめて読めば、キャストなしで数値として扱えることが分かります。"
  trace:
    - "7行目: T = Integer が決まる。item に 10 が入る"
    - "8行目: get() は Integer の 10 を返す → int に自動変換 → 10 * 2 = 20"
    - "9行目: 20"
- title: "ジェネリックメソッドの推論"
  level: 2
  code: |
    public static <T> List<T> twice(T x) {
        return List.of(x, x);
    }

    List<String> a = twice("hi");
    List<Integer> b = twice(7);
    System.out.println(a.size() + b.get(0) + a.get(1));
  question: "出力は?"
  choices:
    - "27hi"
    - "9hi"
    - "2hi7"
    - "コンパイルエラー"
  answer: 1
  explanation: "twice(\"hi\") では T = String、twice(7) では T = Integer と推論されます。最後の行は左から評価:a.size() は 2、b.get(0) は 7、2 + 7 = 9(int どうしの足し算)。そこに a.get(1) = \"hi\" が連結されて \"9hi\"。ジェネリクスと文字列連結の順序を同時に読む問題です。"
  trace:
    - "5行目: T = String。a は [\"hi\", \"hi\"]"
    - "6行目: T = Integer。b は [7, 7]"
    - "7行目: 2 + 7 = 9(まだ数値)→ 9 + \"hi\" = \"9hi\""
- title: "境界を越える型"
  level: 2
  code: |
    public static <T extends Comparable<T>> T max(T a, T b) {
        return a.compareTo(b) >= 0 ? a : b;
    }

    System.out.println(max(3, 8));
    System.out.println(max("pear", "apple"));
    System.out.println(max(new Object(), new Object()));
  question: "この3行を含むコードは?"
  choices:
    - "8 / pear / (何かのアドレス) と表示"
    - "8 / apple / 実行時エラー"
    - "7行目でコンパイルエラー"
    - "1行目でコンパイルエラー"
  answer: 2
  explanation: "> は「T は自分自身と比較できる型に限る」という境界です。Integer と String は Comparable を実装しているので OK。Object は Comparable ではないので、7行目は境界を満たさずコンパイルエラーになります。実行前に止まるのが境界の役目です。"
  trace:
    - "1行目: 境界付きジェネリックメソッド。Comparable の compareTo が使える"
    - "5行目: T = Integer。3.compareTo(8) は負 → 8"
    - "6行目: T = String。\"pear\".compareTo(\"apple\") は正 → pear"
    - "7行目: Object は Comparable ではない → コンパイルエラー"
- title: "入れ子の Map を読む"
  level: 2
  code: |
    Map<String, List<String>> byDept = new HashMap<>();
    byDept.computeIfAbsent("dev", k -> new ArrayList<>()).add("taro");
    byDept.computeIfAbsent("dev", k -> new ArrayList<>()).add("hanako");
    byDept.computeIfAbsent("ops", k -> new ArrayList<>()).add("jiro");
    List<String> dev = byDept.get("dev");
    System.out.println(dev.size() + " " + byDept.size() + " " + byDept.get("hr"));
  question: "出力は?"
  choices:
    - "2 2 null"
    - "2 3 null"
    - "3 2 []"
    - "NullPointerException が発生"
  answer: 0
  explanation: "Map> は「部署名 → 名前リスト」。computeIfAbsent は「キーがなければ作って入れ、あればそれを返す」ので、\"dev\" のリストに 2 人、\"ops\" に 1 人。Map のキーは 2 個。存在しない \"hr\" の get は null(例外にはなりません)。get の戻り値の型が List だと分かれば、dev.size() が読めます。"
  trace:
    - "2行目: \"dev\" がないので新しい ArrayList を作って登録し、\"taro\" を追加"
    - "3行目: \"dev\" はあるのでそのリストに \"hanako\" を追加 → 2人"
    - "4行目: \"ops\" を新規作成して \"jiro\" を追加"
    - "5行目: 型は List。要素は 2"
    - "6行目: 2 2 null(Map.get は存在しないキーで null を返す)"
- title: "共通レスポンス型の T を追う"
  level: 3
  code: |
    public class ApiResponse<T> {
        private final T data;
        private ApiResponse(T data) { this.data = data; }
        public static <T> ApiResponse<T> ok(T data) { return new ApiResponse<>(data); }
        public T getData() { return data; }
    }

    ApiResponse<List<Integer>> res = ApiResponse.ok(List.of(10, 20, 30));
    int total = 0;
    for (Integer n : res.getData()) {
        total += n;
    }
    System.out.println(total + " " + res.getData().getClass().getSimpleName().isEmpty());
  question: "出力は?"
  choices:
    - "60 false"
    - "60 true"
    - "コンパイルエラー"
    - "30 false"
  answer: 0
  explanation: "ok(List.of(10, 20, 30)) で T = List と推論され、res.getData() は List を返します。拡張 for で合計 60。getClass().getSimpleName() は実行時のクラス名(ListN など実装クラスの名前)で、空ではないので isEmpty() は false。ポイントは「T に何が入ったか」を当てはめると getData() の型が分かり、for で回せると読めることです。"
  trace:
    - "8行目: static  の T = List。res は ApiResponse>"
    - "10行目: getData() は List → Integer を1つずつ取り出せる"
    - "11行目: 10 + 20 + 30 = 60"
    - "13行目: 実行時のクラス名は空文字ではない → false。出力 \"60 false\""

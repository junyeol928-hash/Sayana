- after: Java 標準のアノテーション
  question: |
    `@Override` を付けずに書いた。出力は?
    ```java
    class Base { public String name() { return "base"; } }
    class Child extends Base {
        public String Name() { return "child"; }
    }
    Base b = new Child();
    System.out.println(b.name());
    ```
  choices: ["base", "child", "コンパイルエラー"]
  answer: 0
  explanation: |
    `Name()` は大文字の N で、親の `name()` とは別のメソッドになる。上書きしていないので親の `name()` が呼ばれて base。`@Override` を付けていれば、上書きの相手がいないとコンパイルエラーで止めてくれた。
- after: "@Retention と @Target"
  question: |
    `@Retention` を書かずにアノテーションを作った。実行時に読むと?
    ```java
    @Target(ElementType.METHOD)
    @interface Audited { String value(); }
    // @Audited("X") を付けたメソッド m について
    System.out.println(m.getAnnotation(Audited.class));
    ```
  choices: ["null", "付けた値(X)が読める"]
  answer: 0
  explanation: |
    `@Retention` を省略すると `CLASS` になり、class ファイルには残るが実行時には読めない。だから `getAnnotation` は null を返す。実行時に読むなら `@Retention(RetentionPolicy.RUNTIME)` を明示する。
- after: リフレクションで読む
  question: |
    `hello` には `@Audited` が付いていない。次のコードは?
    ```java
    Method m = KeyService.class.getMethod("hello", String.class);
    Audited a = m.getAnnotation(Audited.class);
    System.out.println(a.value());
    ```
  choices: ["NullPointerException", "空文字が出る", "コンパイルエラー"]
  answer: 0
  explanation: |
    付いていないアノテーションを `getAnnotation` すると null が返り、その `value()` を呼ぶので NPE になる。だから読む側は `if (a == null)` で「目印なし」を先に分ける。付いているかどうかは実行時に決まるので、コンパイルは通る。

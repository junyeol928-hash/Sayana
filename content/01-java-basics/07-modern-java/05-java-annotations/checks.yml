- after: Java 標準のアノテーション
  question: |
    `@Override` を付けずに書いた。出力は?
    ```java
    class Base { public String name() { return "base"; } }
    class Child extends Base {
        public String Name() { return "child"; }
    }
    Base b = new Child();
    System.out.println(b.name());
    ```
  choices: ["base", "child", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "`Name()` が `name()` を上書きしたと読んだ答え。大文字の N で別のメソッドになり、上書きしていない"
    - "綴り違いをコンパイラが見つけると読んだ答え。止めてくれるのは `@Override` を付けたときだけ"
  explanation: |
    `Name()` は大文字の N で、親の `name()` とは別のメソッドになる。上書きしていないので親の `name()` が呼ばれて base。
- after: "@Retention と @Target"
  question: |
    `@Retention` を書かずにアノテーションを作った。実行時に読むと?
    ```java
    @Target(ElementType.METHOD)
    @interface Audited { String value(); }
    // @Audited("X") を付けたメソッド m について
    System.out.println(m.getAnnotation(Audited.class));
    ```
  choices: ["`null`", "付けた値(X)が読める", "コンパイルエラー(`@Retention` が無い)"]
  answer: 0
  why:
    - ""
    - "既定で実行時まで残ると読んだ答え。省略すると `CLASS` で、実行時には読めない"
    - "`@Retention` は必ず書くものと読んだ答え。省略でき、そのときは `CLASS` になる"
  explanation: |
    `@Retention` を省略すると `CLASS` になり、class ファイルには残るが実行時には読めない。だから `getAnnotation` は `null` を返す。実行時に読むなら `@Retention(RetentionPolicy.RUNTIME)` を明示する。
- after: リフレクションで読む
  question: |
    `hello` には `@Audited` が付いていない。次のコードは?
    ```java
    Method m = KeyService.class.getMethod("hello", String.class);
    Audited a = m.getAnnotation(Audited.class);
    System.out.println(a.value());
    ```
  choices: ["`NullPointerException`", "空文字(`\"\"`)が出る", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "付いていなければ空の値が入ると読んだ答え。`getAnnotation` が `null` を返し、`value()` を呼べない"
    - "付いていないことをコンパイラが見抜くと読んだ答え。付いているかは実行時に決まる"
  explanation: |
    付いていないアノテーションを `getAnnotation` すると `null` が返り、その `value()` を呼ぶので NPE になる。だから読む側は `if (a == null)` で「目印なし」を先に分ける。

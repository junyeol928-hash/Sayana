- after: Date / Calendar はなぜ嫌われたか
  question: |
    `cal.clear();` のあとに次の行を実行した。何月何日になる?
    ```java
    cal.set(2024, 11, 25);
    ```
  choices: ["12月25日", "11月25日", "10月25日"]
  answer: 0
  why:
    - ""
    - "月を 1 始まりで読んだ答え。Calendar では違う"
    - "0 始まりを「1 を引く」と逆に読んだ答え。0 が 1 月なので、11 は 12 月"
  explanation: |
    Calendar の月は 0 始まりなので、`11` は 12 月。年と日はそのままなので 2024年12月25日。java.time の `LocalDate.of(2024, 11, 25)` なら月は 1 始まりで 11 月になる。
- after: クラスの使い分け
  question: |
    タイムゾーンが UTC のサーバーで、日本時間 2024-04-01 08:00 に次の行を実行した。結果は?
    ```java
    LocalDate today = LocalDate.now();
    ```
  choices: ["2024-03-31", "2024-04-01"]
  answer: 0
  why:
    - ""
    - "`now()` が日本の今日を返すと読んだ答え。引数なしの `now()` は、サーバーのゾーン(UTC)で読む"
  explanation: |
    引数なしの `now()` は、サーバーのタイムゾーンで「今」を読む。日本時間 8:00 は UTC ではまだ前日の 23:00 なので 3/31。日本の「今日」が欲しいなら `LocalDate.now(ZoneId.of("Asia/Tokyo"))` と書く。
- after: 期間:Period と Duration
  question: |
    出力は?
    ```java
    Duration d = Duration.between(
        LocalTime.of(8, 45), LocalTime.of(17, 15));
    System.out.println(d.toHours());
    ```
  choices: ["8", "8.5", "510"]
  answer: 0
  why:
    - ""
    - "`toHours()` が端数を小数で返すと読んだ答え。返すのは整数で、30 分は切り捨てる"
    - "差を分で数えた答え。510 は `toMinutes()` の値で、`toHours()` は時間の数だけ返す"
  explanation: |
    差は 8 時間 30 分(`PT8H30M`)。`toHours()` は何時間分かを整数で返し、端数の 30 分は切り捨てて 8。残りの 30 分は `toMinutesPart()` で取る。

# ローカル版 Java道場から移した教材(scripts/import-local-dojo.mjs で生成。以後は手で直してよい)
- title: "Optional と null の扱い"
  intro: "Spring Boot の Service 層では、Repository が返す Optional をどう扱うかが読解の要になります。「見つからなければ例外」「あれば DTO に変換」の2パターンを押さえれば、ほとんどのコードが読めます。"
  code: |
    @Service
    @RequiredArgsConstructor
    public class UserService {

        private final UserRepository userRepository;

        public UserDto getUser(Long id) {
            return userRepository.findById(id)
                    .map(UserDto::from)
                    .orElseThrow(() -> new NotFoundException("user not found: " + id));
        }

        public String describeNickname(Long id) {
            return userRepository.findById(id)
                    .map(User::getNickname)
                    .filter(n -> !n.isBlank())
                    .orElseGet(() -> "(未設定)");
        }

        public void deactivate(Long id) {
            User user = userRepository.findById(id)
                    .orElseThrow(() -> new NotFoundException("user not found: " + id));
            user.setActive(false);
        }
    }
  notes:
    7: "Spring Data JPA の findById は Optional<User> を返すのが約束(戻り値の型を見れば分かる)"
    8: "見つかった場合だけ Entity(User)を DTO(UserDto)に変換。無ければ以降は素通り"
    9: "「見つからなければ例外」の定番形。この1行を見たら「無ければ 404 相当のエラー」と読める"
    15: "filter で「空文字なら無いのと同じ扱い」にしている。map → filter → orElseGet の並びを1行ずつ型を追えば読める"
    20: "同じ orElseThrow だが、こちらは Entity をそのまま使い、後続で状態を変更している"
  points:
    - "findById(...) のような Optional を返すメソッドを見たら、その後ろに続く .map / .filter / .orElseXxx を1段ずつ追う"
    - "orElseThrow(() -> new XxxException(...)) は「見つからなければこの例外」という宣言。例外クラスを見れば HTTP ステータス(404 など)が想像できることが多い(@ControllerAdvice 章で扱う)"
    - "map の中でさらに Optional を返すメソッドを呼んでいたら flatMap になっているはずと疑い、なっていなければ二重 Optional の可能性を疑う"
    - "Entity や DTO のフィールドに Optional 型が使われていないか確認する。あれば設計上の注意点として読む"

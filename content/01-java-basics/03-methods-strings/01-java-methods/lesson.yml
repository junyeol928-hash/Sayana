id: java-methods
title: メソッド
status: ready
minutes: 15
summary: 処理に名前を付けて呼び出すメソッド。引数と戻り値、static の意味、オーバーロード、Java が「値渡し」である本当の意味、可変長引数と再帰まで。
goals:
  - 戻り値・引数・void を使って static メソッドを定義し、呼び出せる
  - public static void main の各部品の意味を説明できる
  - 全経路で return が必要な理由を理解し、早期 return(ガード節)で書ける
  - オーバーロードのルール(シグネチャに戻り値の型は含まれない)を説明できる
  - Java が常に値渡しであること、参照型では「参照の値」が渡ることを図で説明できる
  - 可変長引数と再帰(終了条件と StackOverflowError)を使える
samples:
  - title: 請求計算をメソッドに分ける
    description: 戻り値のあるメソッドと void のメソッド。main から `static` メソッドを呼び出します。
    code: |
      // 請求書の金額をメソッドに分けて計算する
      // ここを変えてみよう:980 や 3 を変える / printLine の呼び出しを増やす
      public class Invoice {
          static int subtotal(int price, int qty) {
              return price * qty;
          }

          static int withTax(int amount) {
              return amount * 110 / 100;      // 消費税10%(切り捨て)
          }

          static void printLine(String label, int yen) {   // void:値を返さない
              System.out.println(label + ": " + yen + "円");
          }

          public static void main(String[] args) {
              int sub = subtotal(980, 3);     // ここを変えてみよう
              printLine("小計", sub);
              printLine("税込", withTax(sub));
          }
      }
  - title: Java は値渡し(配列は「参照の値」が渡る)
    description: |
      int を渡したメソッドで書き換えても呼び出し元は変わりません。配列は中身の書き換えだけが呼び出し元に見え、仮引数への新しい配列の代入は見えません。
    code: |
      import java.util.Arrays;

      // Java は常に値渡し。参照型は「参照の値」がコピーされて渡る
      // ここを変えてみよう:reset の中で prices[1] = 777; も書いてみる
      public class PassByValue {
          static void addTen(int n) {
              n = n + 10;                     // コピーを書き換えただけ
              System.out.println("  addTen の中: n = " + n);
          }

          static void clear(int[] prices) {
              prices[0] = 0;                  // 同じ配列の中身を変更 → 呼び出し元にも見える
          }

          static void reset(int[] prices) {
              prices = new int[]{9, 9};       // 仮引数の向き先を変えただけ → 呼び出し元は無関係
              System.out.println("  reset の中: " + Arrays.toString(prices));
          }

          public static void main(String[] args) {
              int x = 5;
              addTen(x);
              System.out.println("addTen の後: x = " + x);

              int[] p = {100, 200};
              clear(p);
              System.out.println("clear の後: " + Arrays.toString(p));
              reset(p);
              System.out.println("reset の後: " + Arrays.toString(p));
          }
      }
  - title: オーバーロードと可変長引数
    description: 同じ名前でも引数の型・数が違えば別のメソッド。可変長引数は0個でも呼べます。
    code: |
      // オーバーロードと可変長引数
      // ここを変えてみよう:total(500, 3, 200) の 200 を消す / sum の引数を増やす・空にする
      public class Overload {
          static int total(int price, int qty) {
              return total(price, qty, 0);    // 少ない版が多い版を呼ぶ
          }

          static int total(int price, int qty, int off) {
              return price * qty - off;
          }

          static double total(double price, int qty) {   // 引数の型が違えば別のメソッド
              return price * qty;
          }

          static int sum(int... nums) {       // nums の正体は int[]
              int s = 0;
              for (int n : nums) {
                  s += n;
              }
              return s;
          }

          public static void main(String[] args) {
              System.out.println(total(500, 3));        // total(int, int)
              System.out.println(total(500, 3, 200));   // total(int, int, int)
              System.out.println(total(99.5, 2));       // total(double, int)
              System.out.println(sum());                // 0個でもOK
              System.out.println(sum(1, 2, 3, 4));
          }
      }
  - title: 再帰で階乗
    description: 終了条件(`n <= 1`)を消すと `StackOverflowError` になるのを確かめてみましょう(数秒かかることがあります)。
    code: |
      // 再帰で階乗を計算する
      // ここを変えてみよう:n を 20 や 21 にする(long の範囲を超えるとどうなる?)
      // if の終了条件を消すと StackOverflowError になる
      public class Factorial {
          static long factorial(int n) {
              if (n <= 1) {
                  return 1;                   // 終了条件(これがないと永遠に潜る)
              }
              return n * factorial(n - 1);    // 自分自身を呼ぶ
          }

          public static void main(String[] args) {
              int n = 5;
              System.out.println(n + "! = " + factorial(n));
              for (int i = 1; i <= 10; i++) {
                  System.out.print(factorial(i) + " ");
              }
              System.out.println();
          }
      }
quiz:
  - question: |
      次のコードを実行したときの出力は?
      ```java
      static void twice(int n) {
          n = n * 2;
      }

      // main の中
      int a = 10;
      twice(a);
      System.out.println(a);
      ```
    choices: ["20", "10", "0", "コンパイルエラー"]
    answer: 1
    explanation: |
      Java は **値渡し** です。`twice(a)` を呼ぶと `a` の値 10 が仮引数 `n` に **コピー** され、`n = n * 2` はそのコピーを 20 にしただけ。呼び出し元の `a` は 10 のままです。
      呼び出し元に結果を届けたいなら、戻り値を `int` にして `return n * 2;` とし、`a = twice(a);` のように受け取ります。void のメソッドが値を返さないのでコンパイルエラー……ということもありません(何も返していないので正しいコードです)。
  - question: |
      次のコードを実行したときの出力は?
      ```java
      static void m(int[] a) {
          a[0] = 5;
          a = new int[]{7, 7};
          a[1] = 9;
      }

      // main の中
      int[] x = {1, 2};
      m(x);
      System.out.println(x[0] + "," + x[1]);
      ```
    choices: ["1,2", "7,9", "5,9", "5,2"]
    answer: 3
    explanation: |
      配列を渡すと「参照の値」がコピーされ、`a` と `x` は同じ配列を指します。だから `a[0] = 5` は呼び出し元の `x` にも見えます。
      ところが `a = new int[]{7, 7}` は **仮引数 `a` の向き先を新しい配列に変えただけ** で、`x` は元の配列を指したまま。その後の `a[1] = 9` は新しい配列を書き換えるので、`x` には関係ありません。結果は `5,2` です。
      `7,9` になるのは「参照渡し」の言語の場合。Java は参照渡しではないことがよく分かる例です。
  - question: |
      同じクラスの中に次の2つのメソッドを **一緒に** 定義したとき、コンパイルエラーになるのはどれ?
    choices: ["int calc(int a) と long calc(int a)", "int calc(int a) と int calc(long a)", "int calc(int a) と int calc(int a, int b)", "int calc(int a, String s) と int calc(String s, int a)"]
    answer: 0
    explanation: |
      メソッドを区別するのは **シグネチャ(名前+引数の型の並び)** で、戻り値の型は含まれません。`int calc(int a)` と `long calc(int a)` はシグネチャが同じなので `method calc(int) is already defined` というエラーになります。`calc(1);` と呼ばれてもどちらか決められないからです。
      残りはすべて正しいオーバーロードです。引数の型が違う(`int` と `long`)、数が違う、**並びが違う**(`int, String` と `String, int`)のいずれも別のメソッドとして扱われます。
  - question: |
      次の4つのメソッドのうち、**コンパイルが通る** のはどれ?
      ```java
      // A
      static int a(int x) {
          if (x > 0) { return 1; }
      }
      // B
      static int b(int x) {
          if (x > 0) { return 1; }
          else if (x <= 0) { return 0; }
      }
      // C
      static int c(int x) {
          if (x > 0) { return 1; }
          return 0;
      }
      // D
      static void d(int x) {
          return x;
      }
      ```
    choices: ["A", "B", "C", "D"]
    answer: 2
    explanation: |
      C は `x > 0` なら 1、そうでなければ if を抜けて `return 0;` に来るので、すべての経路で値を返します。
      A は `x <= 0` の経路で何も返さないので `missing return statement`。紛らわしいのは B で、人間には「`x > 0` か `x <= 0` のどちらかは必ず成り立つ」と分かりますが、**コンパイラは条件式の中身を論理的に解析しません**。最後が `else` で終わっていないので「どちらも false で抜ける経路がある」とみなされ、同じく `missing return statement` です。
      D は void(戻り値なし)なのに値を返そうとしているので `incompatible types: unexpected return value` です。
  - question: |
      次のコードを実行するとどうなる?
      ```java
      static int count(int n) {
          return 1 + count(n - 1);
      }

      // main の中
      System.out.println(count(3));
      ```
    choices: ["3 と出力される", "実行時に StackOverflowError が発生する", "コンパイルエラーになる", "6 と出力される"]
    answer: 1
    explanation: |
      `count` には **終了条件(どこかで再帰をやめて値を返す分岐)がありません**。`count(3)` → `count(2)` → `count(1)` → `count(0)` → `count(-1)` … と永遠に自分を呼び続け、そのたびにスタックフレームが積まれて、最後は `java.lang.StackOverflowError` で止まります。
      文法上は正しいので、コンパイルエラーにはなりません(コンパイラは無限再帰を検出しない)。`if (n <= 0) { return 0; }` を先頭に足せば 3 が返ります。
columns:
  - type: mistake
    title: 「値を入れ替える swap メソッド」が作れない
    body: |
      C/C++ 経験者が Java で最初にハマるのがこれです。

      ```java
      static void swap(int a, int b) {
          int t = a;
          a = b;
          b = t;
      }
      int x = 1, y = 2;
      swap(x, y);
      System.out.println(x + "," + y);  // 1,2
      ```

      `a` と `b` は `x` と `y` の **コピー** なので、中で入れ替えても呼び出し元には届きません。C++ の `int&` や C# の `ref` のような「変数そのものを渡す」仕組みが Java にはないからです。

      2つの値を変えたいなら、①配列の要素を入れ替える `swap(int[] arr, int i, int j)`、②新しい値を `return` で返して呼び出し元で代入する、のどちらか。現場では②が基本です。**結果は戻り値で返す** ほうが、呼び出し側から動きが見えます。
  - type: genba
    title: "createUser(\"山田\", true, false, true) は何をしている?"
    body: |
      コードレビューでよく指摘されるのが、**boolean 引数が並んだメソッド** です。

      ```java
      createUser("山田", true, false, true);
      ```

      呼び出し側を見ても `true` や `false` の意味が分からず、定義を開いて「2番目が管理者フラグ、3番目がメール送信……」と確認する羽目になります。順番を間違えても、全部 boolean なのでコンパイラは何も言いません。

      定番の対策は、
      - **メソッドを分ける**:`createAdmin(name)` と `createUser(name)` のように目的ごとに名前を付ける
      - **引数をクラスや enum にまとめる**(後のレッスンで学ぶ)
      - 呼び出し側で `boolean sendMail = false;` と **名前付きの変数** にしてから渡す

      「引数が4つ以上」「boolean 引数が2つ以上」は、設計を見直す合図です。
  - type: trivia
    title: スタックは何段まで? Java が末尾再帰を最適化しない話
    body: |
      JVM はスレッドごとに **スタック** を持ち、メソッド呼び出しのたびにスタックフレームを積みます。64ビット環境の既定サイズは多くの場合 1MB で、単純な再帰なら深さ **1万〜数万段** で `StackOverflowError` です。`java -Xss4m Main` のように `-Xss` で増やせますが、根本対策ではありません。

      Scheme などの関数型言語は、`return f(n - 1);` のように最後の処理が自分の呼び出しだけの **末尾再帰** を、フレームを積まないループに変換する最適化を仕様で保証しています。Java の javac と JVM はこれをしません。スタックトレースを正確に残すため、などが理由とされます。

      だから Java では、深さが入力サイズに比例する再帰(長いデータを1件ずつ再帰でたどる等)は避け、ループで書くのが鉄則です。

id: java-inheritance
title: 継承
status: ready
minutes: 15
summary: extends で既存クラスを土台にする。super とコンストラクタの順番、@Override、Object の toString/equals、そして「継承より委譲」まで。
goals:
  - extends で子クラスを作り、is-a 関係が成り立つかで継承の是非を判断できる
  - super(...) とコンストラクタが「親→子」の順に呼ばれる仕組みを説明できる
  - "@Override を付けてメソッドをオーバーライドし、super.メソッド() で親の処理を再利用できる"
  - protected / final / Object クラス(toString・equals)の役割を説明できる
  - オーバーロードとオーバーライドの違い、「継承より委譲」の理由を説明できる
samples:
  - title: 社員の給与計算(extends と @Override)
    description: 正社員・パート・マネージャーが、それぞれ自分の `salary()` を持ちます。`Manager` は `super.salary()` で親の計算を再利用しています。
    code: |
      class Employee {
          private final String name;
          Employee(String name) { this.name = name; }
          String getName() { return name; }
          int salary() { return 200_000; }
      }

      class PartTimer extends Employee {
          private final int hours;
          PartTimer(String name, int hours) {
              super(name);               // 親のコンストラクタで name を初期化
              this.hours = hours;
          }
          // ここを変えてみよう:@Override を消してメソッド名を salaly に typo すると?
          // (@Override ありならコンパイルエラー、なしなら黙って 200000 が返る)
          @Override
          int salary() { return hours * 1_200; }
      }

      class Manager extends Employee {
          Manager(String name) { super(name); }
          @Override
          int salary() {
              return super.salary() + 50_000;  // 親の計算 + 役職手当
          }
      }

      // ここを変えてみよう:hours を 160 にしてみる
      Employee e = new Employee("田中");
      PartTimer p = new PartTimer("鈴木", 80);
      Manager m = new Manager("佐藤");
      System.out.println(e.getName() + ": " + e.salary() + "円");
      System.out.println(p.getName() + ": " + p.salary() + "円");
      System.out.println(m.getName() + ": " + m.salary() + "円");
  - title: コンストラクタが呼ばれる順番
    description: 子のコンストラクタは、先頭で(書かなくても)親のコンストラクタを呼びます。だから出力は必ず「親→子」の順です。
    code: |
      class A {
          A() { System.out.println("A のコンストラクタ"); }
      }
      class B extends A {
          B() {
              super();   // 書かなくても自動で挿入される
              System.out.println("B のコンストラクタ");
          }
      }
      class C extends B {
          C() { System.out.println("C のコンストラクタ"); }
      }

      // ここを変えてみよう:new B() にする / B の super(); を2行目に移動してみる(エラーになる)
      new C();
  - title: toString と equals をオーバーライドする
    description: "Object から引き継いだ `toString()` は「クラス名@ハッシュ値」、`equals()` は「同じオブジェクトか」の判定です。JShell ではクラス名の前に `REPL.$JShell$..` が付きます。"
    code: |
      class RawPoint {             // 何もオーバーライドしない
          final int x, y;
          RawPoint(int x, int y) { this.x = x; this.y = y; }
      }

      class Point {
          final int x, y;
          Point(int x, int y) { this.x = x; this.y = y; }

          @Override
          public String toString() {
              return "Point(" + x + ", " + y + ")";
          }

          @Override
          public boolean equals(Object o) {   // 引数は必ず Object 型
              if (!(o instanceof Point)) {
                  return false;
              }
              Point other = (Point) o;
              return x == other.x && y == other.y;
          }

          @Override
          public int hashCode() {
              return java.util.Objects.hash(x, y);
          }
      }

      // ここを変えてみよう:座標を変える
      // equals の引数を Point 型にしてみる(@Override がエラーを出す)
      System.out.println(new RawPoint(1, 2));
      RawPoint r = new RawPoint(1, 2);
      System.out.println(r.equals(new RawPoint(1, 2)));
      System.out.println(new Point(1, 2));
      System.out.println(new Point(1, 2).equals(new Point(1, 2)));
quiz:
  - question: |
      次のコードを実行したときの出力は?
      ```java
      class P {
          P() { System.out.print("1"); }
      }
      class Q extends P {
          Q() { System.out.print("2"); }
      }
      new Q();
      ```
    choices: ["2", "12", "21", "コンパイルエラー"]
    answer: 1
    explanation: |
      `Q()` に `super()` は書かれていませんが、コンパイラが先頭に **引数なしの `super()` を自動挿入** します。そのため親の `P()` が先に実行されて `1`、続いて `2` が出力され、`12` です。
      `2` だけにはなりません(親のコンストラクタは省略できない)。順番も必ず「親→子」なので `21` にもなりません。
  - question: |
      次のコードについて正しい説明はどれ?
      ```java
      class Shape {
          private final String name;
          Shape(String name) { this.name = name; }
      }
      class Circle extends Shape {
          private final double r;
          Circle(double r) { this.r = r; }
      }
      ```
    choices: ["問題なくコンパイルできる", "Shape の name が private なので Circle が継承できずエラー", "Circle のコンストラクタで引数なしの Shape() を呼ぼうとしてエラー", "Circle が final フィールドを持つのでエラー"]
    answer: 2
    explanation: |
      `Circle(double r)` には `super(...)` がないので、コンパイラが `super()` を自動挿入します。ところが `Shape` には `Shape(String)` しかなく、引数なしのコンストラクタがないため `constructor Shape in class Shape cannot be applied to given types` になります。`super("円");` を先頭に書けば直ります。
      親の private フィールドがあっても継承自体はできます(子から直接触れないだけ)。final フィールドもコンストラクタで初期化していれば問題ありません。
  - question: |
      次のコードを実行したときの出力は?
      ```java
      class Emp {
          int pay() { return 100; }
      }
      class Part extends Emp {
          int pai() { return 50; }
      }
      Part p = new Part();
      System.out.println(p.pay());
      ```
    choices: ["100", "50", "コンパイルエラー", "150"]
    answer: 0
    explanation: |
      `pai` は `pay` の typo なので **オーバーライドではなく、新しいメソッドの追加** です。`p.pay()` は親から引き継いだ `pay()` を呼ぶので `100` が出力されます。コンパイルエラーにもならないのが怖いところです。
      `pai()` に `@Override` を付けていれば `method does not override or implement a method from a supertype` でコンパイル時に気づけました。だから現場では `@Override` を必ず付けます。
  - question: |
      次のコードを実行したときの出力は?
      ```java
      class Base {
          String hello() { return "Base"; }
      }
      class Sub extends Base {
          @Override
          String hello() { return super.hello() + "+Sub"; }
      }
      System.out.println(new Sub().hello());
      ```
    choices: ["Sub", "Base", "StackOverflowError が発生する", "Base+Sub"]
    answer: 3
    explanation: |
      `super.hello()` は **親クラス側の実装** を呼ぶので `"Base"` が返り、そこに `"+Sub"` を連結して `Base+Sub` です。
      もし `super.` を付け忘れて `hello() + "+Sub"` と書くと、自分自身を無限に呼び続けて `StackOverflowError` になります。
  - question: |
      継承(extends)の使い方として **最も適切** なのはどれ?
    choices: ["注文クラスでログ出力を使いたいので、OrderService extends Logger にする", "自社の社員クラス階層で、パート社員を社員の一種として PartTimer extends Employee にする", "String に便利メソッドを足したいので、MyString extends String にする", "2つのクラスの機能を両方使いたいので、extends A, B と書く"]
    answer: 1
    explanation: |
      「パート社員は社員の一種」という **is-a 関係** が自然に成り立ち、自分たちで管理しているクラス階層なので継承の好例です。
      「注文サービスはロガーの一種」は成り立たないので、Logger はフィールドとして **持って任せる(委譲)** べきです。`String` は `final` クラスなので継承できません。Java のクラスは **単一継承** なので `extends A, B` もコンパイルエラーです。
columns:
  - type: trivia
    title: Java 標準ライブラリにもある「継承の失敗作」
    body: |
      「継承より委譲」は Java 自身の反省でもあります。有名なのが `java.util.Stack` です。Java 1.0 で `Stack extends Vector`(Vector は可変長の配列のようなクラス)として作られました。

      その結果、Stack は Vector の public メソッドを全部引き継ぎ、**「上に積んで上から取る」はずのスタックの途中に `add(0, x)` で割り込める** ようになってしまいました。「スタックは配列の一種」という is-a が成り立っていなかったのです。今では Javadoc 自身が `ArrayDeque` などの別クラスを使うよう勧めています。

      `java.util.Properties extends Hashtable` も同類です。設定値(文字列)を入れる箱なのに、親の `put` で文字列以外も入れられ、`getProperty` が `null` を返す事故が起きえます。『Effective Java』は「継承のために設計して文書化せよ、さもなくば継承を禁止せよ」と述べ、これらを反面教師に挙げています。
  - type: mistake
    title: 親のコンストラクタから、子がオーバーライドしたメソッドを呼ぶと……
    body: |
      次のコードの出力は?

      ```java
      class Base {
          Base() { System.out.println(describe()); }
          String describe() { return "base"; }
      }
      class Sub extends Base {
          private String label = "sub";
          @Override
          String describe() { return "label=" + label; }
      }
      new Sub();
      ```

      ```text
      label=null
      ```

      実体が Sub なので、`Base()` の中の `describe()` は **Sub 側** が呼ばれます。しかし Sub のフィールド初期化(`label = "sub"`)は **親のコンストラクタが終わった後**。だから `null` です。

      「親→子」の初期化順の副作用です。コンストラクタからはオーバーライド可能なメソッドを呼ばない(呼ぶなら `private` か `final` だけ)のが鉄則です。
  - type: genba
    title: 5段の継承ツリーと「この処理どこにあるの?」
    body: |
      レガシーな業務システムでよく見るのが、`BaseAction` → `AbstractCommonAction` → `AbstractOrderAction` → `OrderEditAction` → `OrderEditConfirmAction` のような深い継承ツリーです。「共通処理を親に寄せれば楽」と積み重ねた結果です。

      こうなると、`execute()` 1つを読むのに5つのファイルを行き来し、「どの段で上書きされ、どこで `super.execute()` が呼ばれているか」を追う羽目になります。親クラスを1行直したら、無関係な画面が壊れるのもお約束です。

      現場の目安は「継承は1〜2段まで」。共通処理は親クラスではなく、部品クラス(例: `OrderValidator`, `AuditLogger`)にしてフィールドで持たせる(委譲する)ほうが、読みやすくテストもしやすくなります。

- after: extends と is-a 関係
  question: |
    次のコードはどうなる?
    ```java
    class Employee {
        private String name = "佐藤";
    }
    class Manager extends Employee {
        String show() { return name; }
    }
    ```
  choices: ["コンパイルエラー", "`show()` が「佐藤」を返す", "`show()` が `null` を返す"]
  answer: 0
  why:
    - ""
    - "`private` も子から直接読めると読んだ答え"
    - "子の name には値が入らず、`null` になると読んだ答え"
  explanation: |
    `private` のフィールドは、子のオブジェクトの中に存在はするが、子のコードからは直接触れない。親に getter を用意して、それ経由で読む。直接読むと次のエラーになる: `name has private access in Employee`
- after: オーバーライドと @Override
  question: |
    親の `salary()` は 200000 を返す。`new Manager("佐藤").salary()` を呼ぶと?
    ```java
    class Manager extends Employee {
        Manager(String name) { super(name); }
        @Override
        int salary() { return salary() + 50_000; }
    }
    ```
  choices: ["`StackOverflowError` で落ちる", "`250000` が返る", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "`salary()` が親の版を呼ぶと読んだ答え"
    - "自分を呼び続ける形をコンパイラが見抜くと読んだ答え。文法は正しいので通り、実行して落ちる"
  explanation: |
    `super.` の無い `salary()` は Manager 自身を呼ぶので、終わりなく自分を呼び続けてスタックがあふれる。親の計算を使うなら `super.salary() + 50_000`。
- after: protected / final / Object
  question: |
    `Employee` の `protected` メソッドを、**同じパッケージ**にある(子クラスではない)`Report` クラスから呼ぶと?
  choices: ["呼べる", "コンパイルエラー", "コンパイルは通り、実行時にエラー"]
  answer: 0
  why:
    - ""
    - "`protected` を「子クラスだけ」と読んだ答え"
    - "コンパイルは通っても実行時に止められると読んだ答え。同じパッケージからなら、実行しても呼べる"
  explanation: |
    `protected` は同じパッケージのクラスからも見える。子クラスに限られるのは、別パッケージから使う場合。

- after: for 文:3つの部分と実行順
  question: |
    出力は?
    ```java
    int i;
    for (i = 0; i < 10; i += 4) {
    }
    System.out.println(i);
    ```
  choices: ["12", "8", "10"]
  answer: 0
  why:
    - ""
    - "最後に本体を実行したときの値と読んだ答え。そのあと更新で 12 になってから、条件で抜ける"
    - "条件の上限 10 で止まると読んだ答え。i は 4 ずつ増えるので、10 を飛び越して 12 になる"
  explanation: |
    更新は本体の後。i が 0・4・8 の回に本体を実行し、8 の回の更新で 12 になって `12 < 10` が false で抜ける。
- after: break と continue
  question: |
    出力は?
    ```java
    for (int i = 1; i <= 3; i++) {
        switch (i) {
            case 2: break;
            default: System.out.print(i);
        }
    }
    ```
  choices: ["13", "1", "123"]
  answer: 0
  why:
    - ""
    - "`break` でループごと抜けると読んだ答え"
    - "i が 2 の回も `default` が動くと読んだ答え"
  explanation: |
    switch の中の `break` が抜けるのは switch だけで、ループは続く。i が 2 の回は何も出さずに次の回へ進むので `13`。
- after: よくあるミス
  question: |
    `n` が 5 のとき、本体は何回実行される?
    ```java
    for (int i = 0; i <= n; i++) {
        // 本体
    }
    ```
  choices: ["6 回", "5 回"]
  answer: 0
  why:
    - ""
    - "`<= n` を「n 回」と読んだ答え。i は 0 から始まるので、0〜5 の 6 回になる"
  explanation: |
    i は 0〜5 の 6 通り。0 から始めて `<= n` にすると 1 回多い。n 回にしたいなら、0 始まりは `< n`、1 始まりは `<= n` にそろえる。
- before: int rowSum = 0;
  hides: 2
  question: |
    九九の段ごとの合計を出したい。`2の段の合計:` の行に出る数は?
    ```java
    int rowSum = 0;
    for (int i = 1; i <= 3; i++) {
        for (int j = 1; j <= 9; j++) {
            rowSum += i * j;
        }
        System.out.println(i + "の段の合計: " + rowSum);
    }
    ```
  choices: ["135", "90", "45"]
  answer: 0
  why:
    - ""
    - "段ごとに 0 から数え直すと読んだ答え。`rowSum` はループの前で 0 にしたきりで、1 の段の 45 を引きずる"
    - "1 の段の合計のまま変わらないと読んだ答え。2 の段の 90 も足されて 135 になる"
  explanation: |
    `rowSum` を 0 にするのはループの前の 1 回だけ。1 の段の 45 に 2 の段の 90 が足されて 135 になる。段ごとに数え直すなら、`int rowSum = 0;` を外側のループの中に置く。

title: 社内資格試験の合格者を数える
className: ScoreStats
difficulty: 2
problem: |
  社内の資格試験の点数(0〜100点)が `int[]` で渡されます。人事部から次の2つを頼まれました。

  | メソッド | 返す値 |
  |---|---|
  | `int countPassed(int[] scores)` | 合格者数(**60点以上** が合格) |
  | `int countAtOrAboveAverage(int[] scores)` | **平均点以上** の人数 |

  ### 例
  `scores = {80, 45, 60, 92, 59}` のとき

  - `countPassed` → `3`(80, 60, 92)
  - 平均点は `336 / 5 = 67.2` なので、`countAtOrAboveAverage` → `2`(80, 92)

  ### ルール
  - 引数が **`null` または空配列** のときは、どちらのメソッドも `0` を返す。
  - 「平均点以上」は **平均点ちょうどの人も含む**(`>=`)。
  - 平均点は小数になることがある。**小数を切り捨てずに** 比べること。
    例:`{1, 2}` の平均は `1.5` なので、平均以上は `2` の1人だけ。

  ### ヒント
  - `countAtOrAboveAverage` は「① 合計を出して平均を求める」「② もう一度ループして平均以上を数える」の2段階。
    配列はループを何回回してもOKです。
  - `int` 同士の割り算 `sum / scores.length` は小数点以下が消えます。

  ※ メソッドの書き方は次の『メソッド』のレッスンで詳しくやります。今は `// TODO:` の部分だけ書けばOKです。

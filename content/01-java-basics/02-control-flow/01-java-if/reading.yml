# ローカル版 Java道場から移した教材(scripts/import-local-dojo.mjs で生成。以後は手で直してよい)
- title: "else if の評価順"
  level: 1
  code: |
    int temp = 28;
    String comment;
    if (temp >= 30) {
        comment = "暑い";
    } else if (temp >= 20) {
        comment = "過ごしやすい";
    } else {
        comment = "寒い";
    }
    System.out.println(comment);
  question: "出力は?"
  choices:
    - "暑い"
    - "過ごしやすい"
    - "寒い"
    - "何も出力されない"
  answer: 1
  why:
    - "最初の条件 `temp >= 30` を満たすと読んだ答え。28 は 30 未満なので次の 20 以上で決まる"
    - ""
    - "else if を飛ばして else まで進むと読んだ答え。28 は 20 以上なので else if で決まる"
    - "どの分岐にも入らないと読んだ答え。`28 >= 20` が `true` で `comment` に値が入る"
  explanation: "temp は 28 なので最初の条件(30以上)は `false`、次の条件(20以上)が `true` になり、そこで確定します。"
  trace:
    - "3行目: `28 >= 30` → `false`"
    - '5行目: `28 >= 20` → `true`。`comment = "過ごしやすい"`'
    - "以降の else には進まない"
    - "10行目: `過ごしやすい` と表示"
- title: "break のない switch(フォールスルー)"
  level: 2
  code: |
    int month = 2;
    String season;
    switch (month) {
        case 12:
        case 1:
        case 2:
            season = "冬";
            break;
        case 3:
        case 4:
        case 5:
            season = "春";
            break;
        default:
            season = "その他";
    }
    System.out.println(season);
  question: "出力は?"
  choices:
    - "冬"
    - "春"
    - "その他"
    - "コンパイルエラー"
  answer: 0
  why:
    - ""
    - "case 2 から break を越えて下へ落ちると読んだ答え"
    - "中身の無い case 2 は一致にならないと読んだ答え"
    - "中身の無い case を並べると文法違反と読んだ答え"
  explanation: "case 12・1・2 は break を共有せずに連続で並べることで「複数条件を1つの処理にまとめる」書き方です。`month` が 2 なので case 2 に一致し、`\"冬\"` を代入して break します。"
  trace:
    - "3行目: `month` の値 2 と case を照合"
    - "6行目: case 2 に一致 → 6行目から実行開始(break がないので上から降りてきていい)"
    - '7行目: `season = "冬"`'
    - "8行目: break で switch を抜ける"
    - "17行目: `冬` と表示"
- title: "短絡評価と NullPointerException"
  level: 2
  code: |
    String a = "Sato";
    String b = null;
    String c = "Suzuki";
    int count = 0;
    if (a != null && a.length() >= 5) {
        count++;
    }
    if (b != null && b.length() >= 5) {
        count++;
    }
    if (c != null && c.length() >= 5) {
        count++;
    }
    System.out.println(count);
  question: "出力は?(例外になるかも含めて考える)"
  choices:
    - "`0`"
    - "`1`"
    - "`2`"
    - "`NullPointerException` が発生する"
  answer: 1
  why:
    - "Suzuki も 5 文字未満と数えた答え"
    - ""
    - "Sato も 5 文字以上と数えた答え"
    - "`null` の `b` にも `length()` が呼ばれると読んだ答え"
  explanation: "`&&` の左が `b != null` なので、`null` の `b` は右の `length()` を評価する前に `false` 確定し、例外は起きません。`\"Sato\"`(4文字)は 5 以上でないため条件を満たさず、`\"Suzuki\"`(6文字)だけが条件を満たすので `count` は 1 になります。"
  trace:
    - '5行目: `a` は `"Sato"`。`null` ではない → `length()` は 4 → 5以上ではない → `false`(`count` は増えない)'
    - "8行目: `b` は `null`。`b != null` が `false` → 短絡評価で `length()` は呼ばれない → 例外なし、`false`"
    - '11行目: `c` は `"Suzuki"`。`null` ではない → `length()` は 6 → 5以上 → `true` → `count++`'
    - "14行目: count は 1 と表示"
- title: "ガード節への書き換えと動作の一致"
  level: 3
  code: |
    public String check(Integer age) {
        String result;
        if (age != null) {
            if (age >= 18) {
                result = "成人";
            } else {
                result = "未成年";
            }
        } else {
            result = "不明";
        }
        return result;
    }
  question: "このメソッドをガード節で書き直したとき、`age = null` での戻り値は元と比べて?"
  choices:
    - "`\"成人\"` に変わる"
    - "`\"未成年\"` に変わる"
    - "`\"不明\"` のまま"
    - "例外が発生するようになる"
  answer: 2
  why:
    - "ガード節にすると `null` が「成人」の分岐に流れると読んだ答え"
    - "`null` が最後の return まで落ちると読んだ答え"
    - ""
    - "ガード節で `null` のまま `age >= 18` に進むと読んだ答え"
  explanation: |
    ネストした if をガード節に書き換えると、次の 3 行になります。`null` はいちばん上の行で `"不明"` を返します。

    ```java
    if (age == null) return "不明";
    if (age >= 18) return "成人";
    return "未成年";
    ```

    条件の組み合わせと結果の対応は変わりません。読みやすさが変わるだけで、動作(入出力の対応)は同じにするのがリファクタリングの原則です。
  trace:
    - '元のコード: `age` が `null` → 外側の else に入り `result = "不明"`'
    - 'ガード節版: `if (age == null) return "不明";` が最初に一致してそこで終了'
    - 'どちらも `age` が `null` のときは `"不明"` を返す点で同じ'

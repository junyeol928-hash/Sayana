- after: JUnit 5 の基本
  question: |
    `cart.fee()` も `cart.size()` も、期待と違う値を返す。失敗として報告されるのは?
    ```java
    @Test
    void cart() {
        assertEquals(500, cart.fee());
        assertEquals(2, cart.size());
    }
    ```
  choices: ["最初の assertEquals だけ", "両方", "2 つ目の assertEquals だけ"]
  answer: 0
  why:
    - ""
    - "assert を全部実行してから報告すると読んだ答え。最初の失敗で、そのテストは打ち切られる"
    - "後の assert の結果が前を上書きすると読んだ答え。最初に落ちた所で止まり、2 つ目までは進まない"
  explanation: |
    通常の assert は、失敗した時点でそのテストを打ち切る。後ろの `assertEquals(2, cart.size())` は実行されない。両方の失敗をまとめて見たいなら、`assertAll` にラムダを並べて渡す。
- after: 境界値と同値分割
  question: |
    「0円以下はエラー」を `amount < 0` と書き間違えた。代表値の -100・2000・8000 だけでテストすると?
  choices: ["全部成功して、バグを見逃す", "-100 のテストが失敗する", "2000 のテストが失敗する"]
  answer: 0
  why:
    - ""
    - "-100 なら誤りが表に出ると読んだ答え。-100 は `< 0` でもエラーになり、結果が変わらない"
    - "0 が有料の組に紛れ込み、2000 の結果まで変わると読んだ答え。2000 はどちらの式でも同じ結果になる"
  explanation: |
    代表値の -100・2000・8000 は、`< 0` でも `<= 0` でも結果が同じ。正しい式と結果が違うのは境目の 0 だけなので、境界値の 0 をケースに入れて初めて見つかる。
- after: "@ParameterizedTest で表のように書く"
  question: |
    `@CsvSource` の 4 行のうち、`"0, -1"` の行だけが期待と違った。結果は?
  choices: ["その 1 行だけ失敗し、残りの 3 行は成功として並ぶ", "失敗した行で止まり、残りの行は実行されない", "4 行まとめて 1 つのテストとして失敗する"]
  answer: 0
  why:
    - ""
    - "assert の打ち切りが行をまたぐと読んだ答え。打ち切られるのは 1 回分のテストの中だけ"
    - "メソッド 1 つを 1 テストと読んだ答え。`@CsvSource` は 1 行が 1 回分のテストになる"
  explanation: |
    `@CsvSource` の 1 行が 1 回分のテストなので、行ごとに成否が出る。打ち切られるのは、1 回分のテストの中で、失敗した assert より後ろの行。

- after: Path と Files:今どきの書き方
  question: |
    存在しない `x.txt` を消そうとした。それぞれどうなる?
    ```java
    new File("x.txt").delete();      // 旧API
    Files.delete(Path.of("x.txt"));  // 新API
    ```
  choices: ["File は false を返すだけ、Files は NoSuchFileException", "どちらも NoSuchFileException", "どちらも false を返すだけ"]
  answer: 0
  explanation: |
    旧API の `File.delete()` は失敗しても false を返すだけで、戻り値を見なければ失敗に気づけない。`Files.delete` は `NoSuchFileException` などの例外で原因まで教えてくれる。
- after: 文字コード:UTF-8 を明示する理由
  question: |
    Excel で「CSV(コンマ区切り)」として保存した、日本語を含むファイル。charset を省略して読むと?
    ```java
    List<String> lines = Files.readAllLines(csv);
    ```
  choices: ["MalformedInputException で落ちる", "日本語 Windows なら MS932 として正しく読める"]
  answer: 0
  explanation: |
    `Files` のメソッドは charset を省略すると、OS に関係なく常に UTF-8 で読む。MS932 の日本語は UTF-8 としては不正なバイトなので `MalformedInputException` になる。`Charset.forName("MS932")` を渡せば読める。
- after: IOException の扱い
  question: |
    `main` に `throws IOException` を付けた。次の行はコンパイルできる?
    ```java
    paths.forEach(p -> System.out.println(Files.readString(p)));
    ```
  choices: ["コンパイルエラー", "できる"]
  answer: 0
  explanation: |
    `forEach` に渡すラムダは `Consumer` の実装で、その `accept` はチェック例外を投げられない。外側の `main` の `throws` はラムダの中には効かない。ラムダの中で catch して `new UncheckedIOException(e)` で包むか、for 文で書く。

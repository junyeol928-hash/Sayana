title: 勤務時間を「時:分:秒」で表示する
className: TimeFormatter
difficulty: 2
problem: |
  勤怠システムのタイムカードは、勤務時間を **秒数** で記録しています。
  これを画面表示用に `時:分:秒` の文字列に変換します。

  `format(int totalSeconds)` を完成させてください。

  - `totalSeconds` … 勤務時間(秒、0以上)
  - 戻り値 … `"時:分:秒"` の文字列。分と秒は2桁(1桁なら先頭を0で埋める)。時は桁数制限なし(24時間を超えてもそのまま)

  | totalSeconds | 戻り値 |
  |---|---|
  | 59 | `"0:00:59"` |
  | 3600 | `"1:00:00"` |
  | 30615 | `"8:30:15"` |
  | 90000 | `"25:00:00"` |

  **ヒント**(割り算と余りの詳細は次の「演算子」レッスンでやります)
  - `int` 同士の割り算 `/` は、小数点以下が **切り捨て** られる → `7500 / 3600` は `2`
  - `%` は割り算の **余り** → `7500 % 3600` は `300`
  - 1時間 = 3600秒、1分 = 60秒。「まず時間を出し、残りの秒数から分を出す」と考えると分かりやすい

  文字列の組み立て(`String.format`)は雛形に書いてあるので、`hours` / `minutes` / `seconds` の3つの変数を正しく計算すればOKです。
  メソッドの書き方は「メソッド」のレッスンで詳しくやります。今は `// TODO:` の部分だけ書けばOKです。

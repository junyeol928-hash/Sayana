# ローカル版 Java道場から移した教材(scripts/import-local-dojo.mjs で生成。以後は手で直してよい)
- title: "値のコピーと参照のコピー"
  level: 1
  code: |
    int a = 10;
    int b = a;
    b = 20;
    int[] arr1 = {1, 2};
    int[] arr2 = arr1;
    arr2[0] = 50;
    System.out.println(a + " " + arr1[0]);
  question: "配列(`int[]`)は「配列」のレッスンで習います。ここでは `{1, 2}` が「2つの int をまとめた参照型のオブジェクト」で、`arr1[0]` がその先頭の値、とだけ考えてください。出力は?"
  choices:
    - "10 1"
    - "20 50"
    - "10 50"
    - "20 1"
  answer: 2
  why:
    - "配列も代入でコピーされて別物になると読んだ答え。`arr2 = arr1` は同じ配列を指すので 50 になる"
    - "int の代入も同じ箱を共有すると読んだ答え。int は値のコピーなので a は 10 のまま"
    - ""
    - "int と配列の振る舞いを逆に読んだ答え。int は値のコピー、配列は同じものを指す"
  explanation: "int(基本データ型)は値がコピーされるので b を変えても a は 10 のまま。配列(参照型)は住所がコピーされるので arr2 経由の変更が arr1 にも見えます。"
  trace:
    - "1〜2行目: `a = 10`、b にも 10 がコピーされる(別々の箱)"
    - "3行目: b だけが 20 になる。a は 10 のまま"
    - "4〜5行目: arr1 が配列 {1,2} を指し、arr2 も同じ配列を指す"
    - "6行目: 同じ配列の [0] が 50 になる → arr1[0] も 50"
    - "7行目: `10 50` と表示"
- title: "整数の割り算とキャストの位置"
  level: 2
  code: |
    int sum = 17;
    int count = 4;
    double avg1 = sum / count;
    double avg2 = (double) sum / count;
    double avg3 = (double) (sum / count);
    System.out.println(avg1 + " " + avg2 + " " + avg3);
  question: "出力は?"
  choices:
    - "4.25 4.25 4.25"
    - "4.0 4.25 4.0"
    - "4.0 4.25 4.25"
    - "4 4.25 4"
  answer: 1
  why:
    - "double に入れれば割り算も小数になると読んだ答え。`int / int` は 4 に切り捨ててから代入される"
    - ""
    - "キャストを外側に付けても小数で割れると読んだ答え。avg3 では `17 / 4` の 4 が先に決まる"
    - "double の 4 が 4 と表示されると読んだ答え。double は 4.0 と小数点付きで出る"
  explanation: "avg1 は `int / int` の結果の 4 を double に入れるので 4.0。avg2 は先に sum を 17.0 にしてから割るので 4.25。avg3 はカッコの中の `17 / 4` を先に計算して 4 にしてから double にするので 4.0。**キャストがどこに掛かるか**で結果が変わります。"
  trace:
    - "3行目: 17 / 4 → int の 4 → double の箱に入れて 4.0"
    - "4行目: (double) は sum だけに掛かる → 17.0 / 4 → 4.25"
    - "5行目: (double) は (sum / count) 全体に掛かる → (4) → 4.0"
    - "6行目: `4.0 4.25 4.0` と表示"
- title: "文字列と数値の連結"
  level: 2
  code: |
    int x = 1;
    int y = 2;
    System.out.println("結果: " + x + y);
    System.out.println("結果: " + (x + y));
    System.out.println(x + y + "円");
  question: "3行の出力は?"
  choices:
    - "結果: 12 / 結果: 3 / 3円"
    - "結果: 3 / 結果: 3 / 12円"
    - "結果: 12 / 結果: 3 / 12円"
    - "結果: 3 / 結果: 3 / 3円"
  answer: 0
  why:
    - ""
    - "文字列と数値の + の働きを、1 行目と 3 行目で逆に読んだ答え"
    - "後ろに文字列があると、x + y も連結になると読んだ答え"
    - "文字列の後ろの x + y も、先に足し算されると読んだ答え"
  explanation: "+ は左から順に評価されます。文字列が左にあると以降は連結(`\"結果: 1\" + 2` → `\"結果: 12\"`)。カッコで先に足し算すれば 3。最後の行は x + y(数値の足し算=3)が先で、その後に `\"円\"` がつながります。"
  trace:
    - '3行目: `"結果: " + 1` → `"結果: 1"`、`+ 2` → `"結果: 12"`'
    - '4行目: カッコの `1 + 2` が先に 3 → `"結果: 3"`'
    - '5行目: `1 + 2` が先に 3(まだ文字列が出てきていない)→ `"3円"`'
- title: "null の連結とメソッド呼び出し"
  level: 3
  code: |
    final String env = "prod";
    String region = null;        // 地域がまだ設定されていない
    String label = env + "/" + region;
    System.out.println(label + " " + region.toUpperCase());
  question: "最後の行を実行すると?(`toUpperCase()` は文字列を大文字にした文字列を返すメソッド)"
  choices:
    - "`prod/` と表示"
    - "`prod/null` と表示"
    - "`NullPointerException` が発生"
    - "コンパイルエラー"
  answer: 2
  why:
    - "`null` の連結を空文字と読み、その後の `region.toUpperCase()` も見落とした答え"
    - "連結の結果だけを見て、`region.toUpperCase()` を見落とした答え"
    - ""
    - "`null` の変数を使うとコンパイルで止まると読んだ答え。`null` かどうかは実行して初めて分かる"
  explanation: "`region` には `null`(どのオブジェクトも指していない)が入っています。3行目の `env + \"/\" + region` は `null` を `null` という文字としてつなぐだけなので、label は `prod/null` になり例外は出ません。しかし4行目の `region.toUpperCase()` は `null` に対してメソッドを呼ぶので、その瞬間に `NullPointerException` です。println は引数を全部計算してから表示するので、`prod/null` も表示されません。**参照型の変数を使う前に値が入っているか**を追うのが実務の読解の基本です。"
  trace:
    - '1行目: `env` は `"prod"`(final なので再代入はできない)'
    - "2行目: region は `null`。どのオブジェクトも指していない"
    - '3行目: `"prod" + "/" + null` → `"prod/null"`。連結だけなら例外にならない'
    - "4行目: `region.toUpperCase()` → `region` が `null` なので例外"
    - "結果: `NullPointerException` で処理が止まり、何も表示されない"

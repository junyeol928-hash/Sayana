- after: プリミティブ型8種
  question: |
    出力は?
    ```java
    int no = 012;
    System.out.println(no);
    ```
  choices: ["10", "12", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "先頭の 0 を飾りと見て、書いたとおりの 12 と読んだ答え。0 で始まる整数は 8 進数"
    - "先頭にゼロは付けられないと読んだ答え。`012` は 8 進数のリテラルとして通る"
  explanation: |
    先頭の `0` は8進数の印。8進数の `12` は 8 + 2 で 10 になる。番号のように先頭ゼロに意味がある値は、数値ではなく `String` で持つ。
- after: 型変換:拡大変換と縮小変換
  question: |
    次のコードはどうなる?
    ```java
    short a = 10;
    short b = 20;
    short c = a + b;
    ```
  choices: ["コンパイルエラー", "c は 30 になる", "実行時に例外"]
  answer: 0
  why:
    - ""
    - "short 同士の足し算は short のままと読んだ答え"
    - "型が合わないことを実行時に見つけると読んだ答え。代入できるかは、コンパイル時に型だけで決まる"
  explanation: |
    `short` 同士の計算は、結果が `int` になる(二項数値昇格)。`int` から `short` は縮小変換なので、30 のように収まる値でもキャストなしでは入らない。
- after: ラッパークラスとオートボクシング(ちょっとだけ)
  question: |
    実行すると?
    ```java
    Integer stock = null;
    int n = stock;
    ```
  choices: ["NullPointerException", "n は 0 になる", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "null は 0 に置き換わると読んだ答え"
    - "Integer と int は型が違うので代入できないと読んだ答え"
  explanation: |
    `Integer` から `int` へはアンボクシングで自動変換されるので、コンパイルは通る。実行時に null から int を取り出そうとして `NullPointerException` になる。

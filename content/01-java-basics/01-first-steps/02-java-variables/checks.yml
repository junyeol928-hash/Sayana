- after: プリミティブ型8種
  question: |
    出力は?
    ```java
    int no = 012;
    System.out.println(no);
    ```
  choices: ["10", "12", "コンパイルエラー"]
  answer: 0
  explanation: |
    先頭の `0` は8進数の印。8進数の `12` は 8 + 2 で 10 になる。番号のように先頭ゼロに意味がある値は、数値ではなく `String` で持つ。
- after: 型変換:拡大変換と縮小変換
  question: |
    次のコードはどうなる?
    ```java
    short a = 10;
    short b = 20;
    short c = a + b;
    ```
  choices: ["コンパイルエラー", "c は 30 になる"]
  answer: 0
  explanation: |
    `short` 同士の計算は、結果が `int` になる(二項数値昇格)。`int` から `short` は縮小変換なので、30 のように収まる値でもキャストなしでは入らない。
- after: ラッパークラスとオートボクシング(ちょっとだけ)
  question: |
    実行すると?
    ```java
    Integer stock = null;
    int n = stock;
    ```
  choices: ["NullPointerException", "n は 0 になる", "コンパイルエラー"]
  answer: 0
  explanation: |
    `Integer` から `int` へはアンボクシングで自動変換されるので、コンパイルは通る。実行時に null から int を取り出そうとして `NullPointerException` になる。0 に置き換わることはない。

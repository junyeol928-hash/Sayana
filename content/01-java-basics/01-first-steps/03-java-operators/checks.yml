- after: 算術演算子 ─ 整数の割り算は「切り捨て」
  question: |
    出力は?
    ```java
    int n = -5;
    System.out.println(n % 2 == 1);
    ```
  choices: ["`false`", "`true`", "実行時に例外"]
  answer: 0
  why:
    - ""
    - "余りはいつも 0 か正の数と読んだ答え。`%` の符号は割られる数に揃い、`-5 % 2` は `-1`"
    - "負の数の余りは求められず例外になると読んだ答え。例外で止まるのは 0 で割ったときだけ"
  explanation: |
    `%` の結果は割られる数(左側)の符号に揃うので、`-5 % 2` は `-1`。`== 1` にならず `false`。奇数判定は `n % 2 != 0` と書く。
- after: 複合代入とインクリメント
  question: |
    出力は?
    ```java
    int n = 7;
    n = n--;
    System.out.println(n);
    ```
  choices: ["7", "6", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "`n--` で減った 6 が残ると読んだ答え。式の値は減らす前の 7 で、最後の代入で 7 に戻る"
    - "同じ変数を `--` と代入で 2 回書き換える式は通らないと読んだ答え。Java は評価の順が決まっていて通る"
  explanation: |
    後置 `n--` の式の値は減らす **前** の 7。いったん n は 6 になるが、最後の代入で 7 に上書きされる。`i = i++` と同じ罠。
- after: 優先順位と結合規則
  question: |
    出力は?
    ```java
    System.out.println(true || false && false);
    ```
  choices: ["`true`", "`false`", "コンパイルエラー"]
  answer: 0
  why:
    - ""
    - "左から順に `(true || false) && false` と読んだ答え。`&&` が `||` より先に結びつく"
    - "`||` と `&&` を括弧なしで混ぜると通らないと読んだ答え。括弧が無くても優先順位で決まり、そのまま通る"
  explanation: |
    `&&` は `||` より優先度が高いので、`true || (false && false)` と読む。左が `true` なので全体も `true`。
- before: "+ は、どちらかのオペランドが"
  hides: 5
  question: |
    出力は?
    ```java
    System.out.println("1" + 2 + 3);
    ```
  choices: ["123", "6", "15"]
  answer: 0
  why:
    - ""
    - "全部を数の足し算と読んだ答え。左端が文字列なので、最初の `+` から連結になる"
    - "`2 + 3` を先に計算して 5 をつないだ答え。`+` は左から順に評価する"
  explanation: |
    `+` は左から順に計算する。左端の `"1"` が String なので `"1" + 2` が `"12"` になり、そこに 3 をつないで `"123"`。一度 String になると、右はずっと連結。

id: java-hello
title: 環境とHello World
status: ready
minutes: 15
summary: JDK 21 を入れて、javac・java・JShell・STS の4通りで Hello World を動かす。JDK/JRE/JVM の関係とエラーの読み方も押さえる。
goals:
  - JDK・JRE・JVM の違いと、javac → バイトコード → JVM という実行の流れを説明できる
  - Windows に JDK 21 を入れ、JAVA_HOME と Path を設定して java -version / javac -version で確認できる
  - Hello World の各行(public class とファイル名、main メソッド、System.out.println、セミコロン、波括弧)の意味を説明できる
  - javac + java、java Hello.java、JShell、STS のそれぞれでプログラムを実行できる
  - よくあるコンパイルエラー・実行時エラーのメッセージを読んで原因を特定できる

samples:
  - title: はじめての出力
    description: |
      `System.out.println` は文字列を表示して改行します。文字列リテラルは `"` で囲みます。
    code: |
      // ここを変えてみよう:自分の名前やチーム名に書き換えて実行
      System.out.println("Hello, World!");
      System.out.println("はじめまして、ハルです。");
      System.out.println("今日から Java 道場に入門します。");

  - title: print と println の違い
    description: |
      `print` は改行しない、`println` は最後に改行する。引数なしの `println()` は改行だけを出力します。
    code: |
      System.out.print("ラーメン");
      System.out.print("と");
      System.out.println("餃子");   // ここで改行される
      System.out.println("お願いします");
      System.out.println();          // 空行が1行入る
      // ここを変えてみよう:3行目の println を print に変えると、出力はどうなる?
      System.out.print("お会計は");
      System.out.println("こちらです");

  - title: Hello クラスを丸ごと動かす
    description: |
      `public static void main(String[] args)` を持つクラスを宣言すると、この画面では `Hello.main(...)` が自動で呼ばれます。
      コマンドラインの `java Hello` と同じく、JVM が main から実行を始めるイメージです。
    code: |
      public class Hello {
          public static void main(String[] args) {
              // ここを変えてみよう:println の行を増やしたり、わざと ; を消してエラーを見てみよう
              System.out.println("Hello, World!");
              System.out.println("main メソッドから実行が始まります");
          }
      }

  - title: エスケープシーケンスとコメント
    description: |
      `\n`(改行)、`\t`(タブ)、`\"`(ダブルクォート)、`\\`(バックスラッシュ)。コメントは実行結果に影響しません。
    code: |
      // 1行コメント:この行は無視される
      /* 複数行コメント:
         ここも無視される */
      System.out.println("品名\t数量\n\"Java本\"\t1");
      System.out.println("パス: C:\\work\\Hello.java");
      System.out.println("// 文字列の中の // や /* */ はコメントではない");
      // ここを変えてみよう:\t を \n に変えると表示はどう変わる?

quiz:
  - question: |
      次のコードの出力として正しいものはどれ?

      ```java
      System.out.print("A");
      System.out.println("B");
      System.out.print("C");
      System.out.println();
      System.out.println("D");
      ```
    choices:
      - "A B C D がそれぞれ別の行に表示される"
      - "ABCD が1行に表示される"
      - "1行目に AB、2行目に C、3行目に D"
      - "1行目に AB、2行目に C、3行目は空行、4行目に D"
    answer: 2
    explanation: |
      `print` は改行せず、`println` は表示の後に改行します。"A" の後に "B" が続いて改行 → 1行目は `AB`。
      次に "C" を表示し、引数なしの `println()` が改行だけを出力 → 2行目は `C`。最後に `D` と改行 → 3行目は `D`。
      引数なしの `println()` は「改行を1つ出す」だけなので、C の行を終わらせる役目になり、空行は生まれません(4つ目の選択肢の誤り)。

  - question: |
      `Hello.java` に次のコードを書いて `javac Hello.java` を実行した。コンパイルエラーになる行はどれ?

      ```java
      public class Hello {                            // 1行目
          public static void main(String[] args) {    // 2行目
              System.out.printIn("おはよう");          // 3行目
              System.out.println("こんにちは");        // 4行目
          }
      }
      ```
    choices:
      - "3行目"
      - "1行目"
      - "2行目"
      - "4行目"
    answer: 0
    explanation: |
      3行目は `println`(エル)ではなく `printIn`(大文字のアイ)になっています。`PrintStream` に `printIn` というメソッドはないので
      「シンボルを見つけられません」というコンパイルエラーになります。文字列リテラルの中の日本語(4行目の「こんにちは」など)は問題ありません。
      1・2行目はクラス名とファイル名が一致し、main の形も正しいのでエラーにはなりません。

  - question: |
      ファイル `Main.java` に次の内容を保存し、`javac Main.java` を実行した。どうなる?

      ```java
      public class Hello {
          public static void main(String[] args) {
              System.out.println("Hi");
          }
      }
      ```
    choices:
      - "Main.class が作られ、java Main で Hi が表示される"
      - "Hello.class が作られ、java Hello で Hi が表示される"
      - "コンパイルは成功するが、実行時に「メイン・メソッドが見つかりません」となる"
      - "「クラス Helloはpublicであり、ファイルHello.javaで宣言する必要があります」というコンパイルエラーになる"
    answer: 3
    explanation: |
      `public` なクラスは、クラス名と同じ名前のファイルに書く必要があります。`public class Hello` は `Hello.java` に書かなければならず、
      `javac` はコンパイルエラーにします(`.class` は1つも作られません)。
      なお `java Main.java` のような単一ファイル実行(Java 11+)ではこのルールが適用されず Hi が表示されますが、問題は `javac` の場合です。

  - question: |
      JDK・JRE・JVM について、正しい説明はどれ?
    choices:
      - "JVM は .java ファイルを直接読み込んで実行する"
      - "javac は JDK に含まれる開発ツールで、ソースコードをバイトコード(.class)に変換する"
      - "JRE には javac が含まれるので、JRE だけで開発できる"
      - "バイトコードは Windows 用・Mac 用など OS ごとに別々に作る必要がある"
    answer: 1
    explanation: |
      `javac` は JDK の開発ツールで、`.java` を JVM 向けの命令列であるバイトコード(`.class`)に変換します。
      JVM が実行するのはバイトコードで、`.java` を直接ではありません(`java Hello.java` もメモリ上でコンパイルしてから実行しています)。
      JRE は JVM + 標準ライブラリで、`javac` は含まれません。バイトコードは OS に依存しないので、1つの `.class` が各 OS の JVM で動きます(Write once, run anywhere)。

  - question: |
      次のコードの出力として正しいものはどれ?

      ```java
      System.out.println("A /* B */ C"); // D
      /* System.out.println("E"); */
      ```
    choices:
      - "A C"
      - "A C D"
      - "A /* B */ C"
      - "A /* B */ C と E の2行"
    answer: 2
    explanation: |
      `"` で囲まれた文字列リテラルの中にある `/* B */` はコメントではなく、ただの文字です。そのため `A /* B */ C` がそのまま表示されます。
      行末の `// D` は1行コメント、2行目は全体が `/* */` で囲まれたコメントなので、どちらも実行されません。

columns:
  - type: trivia
    title: class ファイルは「CAFEBABE」で始まる
    body: |
      `.class` ファイルの先頭4バイトは必ず16進数で `CA FE BA BE`。JVM が「本当に class ファイルか」を確かめる
      **マジックナンバー** で、Java の生みの親たちのカフェ好きに由来すると言われます。

      直後には **class ファイルのバージョン** があり、JDK 21 なら `65`。古い Java で実行するとこう怒られます。

      ```text
      java.lang.UnsupportedClassVersionError: Hello has been compiled by a more recent version of the Java Runtime (class file version 65.0), this version of the Java Runtime only recognizes class file versions up to 61.0
      ```

      `65.0` は Java 21、`61.0` は Java 17。「コンパイルより古い Java で実行した」サインです。

  - type: genba
    title: 「java -version が 17 のまま」問題
    body: |
      JDK 21 を入れたのに `java -version` が 17 や 1.8 と出る。現場の定番トラブルです。
      原因はたいてい **Path の中で古い Java が先に見つかっている** こと。昔 Oracle の Java を入れた PC には、
      `C:\Program Files\Common Files\Oracle\Java\javapath` が Path の上位に残っていることがあります。

      調べ方は `where java`。見つかった順に表示されるので、**1行目が実際に使われる java** です。

      ```text
      C:\> where java
      C:\Program Files\Common Files\Oracle\Java\javapath\java.exe
      C:\Program Files\Eclipse Adoptium\jdk-21.0.x.x-hotspot\bin\java.exe
      ```

      `%JAVA_HOME%\bin` を上へ移動するか古い Java をアンインストールし、**コマンドプロンプトを開き直して** 再確認しましょう。

  - type: mistake
    title: JAVA_HOME に bin まで書いてしまう
    body: |
      `JAVA_HOME` に設定するのは **JDK のフォルダそのもの** で、`bin` の一つ上です。

      - 正:`C:\Program Files\Eclipse Adoptium\jdk-21.0.x.x-hotspot`
      - 誤:`C:\Program Files\Eclipse Adoptium\jdk-21.0.x.x-hotspot\bin`

      Maven などのツールは `JAVA_HOME` の後ろに `\bin\java.exe` を付け足して探すため、`bin` まで書くと
      `...\bin\bin\java.exe` を探しに行って「JAVA_HOME が正しく設定されていません」と失敗します。
      一方 Path 側は `%JAVA_HOME%\bin` と **bin まで** 書くのが正解。「JAVA_HOME は bin なし、Path は bin あり」とセットで覚えましょう。
      設定後は `echo %JAVA_HOME%` で中身を確認し、そのパスに `bin` フォルダがあることをエクスプローラーでも確かめると確実です。

sts:
  intro: |
    STS(Spring Tool Suite 4)で Java プロジェクトを作り、Hello World を実行します。メニュー名は英語 UI 表記で、
    日本語化(Pleiades など)している場合の表記を括弧で併記しています。画面構成の詳しい説明は第2部で行うので、ここでは「動かす」ことに集中しましょう。
  steps:
    - title: Java プロジェクトの作成ウィザードを開く
      detail: |
        メニューの **File > New > Java Project**(ファイル > 新規 > Java プロジェクト)を選びます。
        STS では Spring 用のパースペクティブになっていて一覧に **Java Project** が無いことがあります。その場合は
        **File > New > Other...**(ファイル > 新規 > その他...)を開き、**Java > Java Project**(Java > Java プロジェクト)を選んで **Next**(次へ)。
    - title: プロジェクト名と JRE を設定する
      detail: |
        - **Project name**(プロジェクト名)に `hello-java` と入力
        - **JRE** 欄で **Use an execution environment JRE**(実行環境 JRE の使用)を選び、`JavaSE-21` を選択
        - **Module** 欄の **Create module-info.java file**(module-info.java ファイルを作成)の **チェックを外す**

        モジュール(module-info.java)は大規模開発向けの仕組みで、入門段階では不要です。チェックを入れたままだと余計なファイルができ、後の演習で混乱の元になります。
        JavaSE-21 が一覧に無い場合は、**Window > Preferences > Java > Installed JREs**(ウィンドウ > 設定 > Java > インストール済みの JRE)で、
        インストールした JDK 21 のフォルダを **Add...**(追加...)してください。
    - title: プロジェクトを作成する
      detail: |
        **Finish**(完了)を押します。「関連付けられたパースペクティブを開きますか?」(**Open Associated Perspective?**)と聞かれたら、
        **Open Perspective**(パースペクティブを開く)でも **No**(いいえ)でも構いません。左側の **Package Explorer**(パッケージ・エクスプローラー)に
        `hello-java` プロジェクトと `src` フォルダが表示されれば成功です。
    - title: クラスを作る
      detail: |
        `src` フォルダを右クリックし、**New > Class**(新規 > クラス)を選びます。
        - **Name**(名前)に `Hello` と入力(ファイル名 `Hello.java` は自動で決まります)
        - **Package**(パッケージ)は空欄のままで OK。「The use of the default package is discouraged.」(デフォルト・パッケージの使用は推奨されません)という警告が出ますが、パッケージは後のレッスンで扱うので今は無視して構いません
        - **Which method stubs would you like to create?**(どのメソッド・スタブを作成しますか?)で **public static void main(String[] args)** に **チェックを入れる**

        **Finish**(完了)を押すと、main メソッド付きの `Hello.java` がエディターに開きます。
    - title: コードを書いて保存する
      detail: |
        main メソッドの中(`// TODO Auto-generated method stub` の行)を次のように書き換えます。

        ```java
        System.out.println("Hello, World!");
        ```

        `sysout` と入力して **Ctrl+Space** を押すと `System.out.println();` が補完されます。
        **Ctrl+S** で保存すると、その時点で自動的にコンパイルされます(`javac` を打つ必要はありません)。間違いがあると赤い波線と、左端に赤い × が表示されます。
    - title: 実行して Console ビューを確認する
      detail: |
        エディター上で右クリックし、**Run As > Java Application**(実行 > Java アプリケーション)を選びます(ショートカットは **Ctrl+F11**)。
        画面下部の **Console**(コンソール)ビューに `Hello, World!` と表示されれば完了です。
        Console が見当たらないときは **Window > Show View > Console**(ウィンドウ > ビューの表示 > コンソール)で開けます。
    - title: わざと間違えてエラーを見る
      detail: |
        `println` を `printIn`(大文字のアイ)に書き換えて保存してみましょう。赤い波線にマウスを乗せると
        「The method printIn(String) is undefined for the type PrintStream」(メソッド printIn(String) は型 PrintStream で未定義です)と表示されます。
        STS は javac とは別の Eclipse 独自のコンパイラを使っているため、文言はコマンドラインと少し違いますが、指している原因は同じです。確認できたら元に戻して保存してください。

checklist:
  - key: jdk-installed
    text: 新しく開いたコマンドプロンプトで java -version と javac -version を実行し、どちらも 21 が表示された
  - key: java-home
    text: echo %JAVA_HOME% で JDK 21 のフォルダ(bin の一つ上)が表示され、Path に %JAVA_HOME%\bin が入っている
  - key: cli-compile-run
    text: Hello.java を javac Hello.java でコンパイルし、java Hello で Hello, World! を表示できた(java Hello.java でも試した)
  - key: jshell-tried
    text: jshell を起動して System.out.println を1行実行し、/exit で終了できた
  - key: sts-hello
    text: STS で Java プロジェクトとクラスを作り、Run As > Java Application で Console に Hello, World! を表示できた
  - key: read-error
    text: わざと printIn や全角スペース、セミコロン忘れを入れてエラーメッセージを読み、行番号と ^ の位置から原因を特定できた

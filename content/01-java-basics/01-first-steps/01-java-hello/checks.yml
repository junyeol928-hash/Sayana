- after: Windows に JDK 21 を入れる
  question: |
    インストーラで Path と JAVA_HOME を設定した。インストールの前から開いていたコマンドプロンプトでは、新しい設定は?
  choices: ["反映されていない", "すぐ反映される", "`java -version` を打つと読み直されて反映される"]
  answer: 0
  why:
    - ""
    - "設定を変えれば、開いている画面にも届くと読んだ答え。画面は開いた時点の環境変数を使い続ける"
    - "コマンドを打つたびに設定を読み直すと読んだ答え。画面が持つのは、開いた時点の古い環境変数のまま"
  explanation: |
    環境変数は、コマンドプロンプトを開いた時点の内容が使われる。開きっぱなしの画面は古いままなので、新しく開き直してから `java -version` で確かめる。
- after: 動かし方は3通り
  question: |
    `javac Hello.java` で `Hello.class` ができた。実行するコマンドは?
  choices: ["`java Hello`", "`java Hello.class`", "`javac Hello`"]
  answer: 0
  why:
    - ""
    - "`javac` と同じくファイル名を渡した答え。`java` は「`Hello.class` という名前のクラス」を探して失敗する"
    - "`javac` と `java` の役割を取り違えた答え。`javac` はコンパイルするだけで、実行するのは `java`"
  explanation: |
    `java` に渡すのはクラス名(`.class` は付けない)。ファイル名を渡すのは `javac` の方。
- after: よくあるミス図鑑
  question: |
    「こんにちは」と「世界」の間に全角スペースを入れた。`javac` でコンパイルすると?
    ```java
    System.out.println("こんにちは　世界");
    ```
  choices: ["コンパイルできる", "コンパイルエラー(不正な文字)", "警告が出るが、コンパイルはできる"]
  answer: 0
  why:
    - ""
    - "全角スペースはどこでもエラーと覚えた答え。不正な文字になるのは、文字列の外に紛れ込んだとき"
    - "全角の混入は警告で知らせると読んだ答え。文字列の中の全角はただの文字で、警告も出ない"
  explanation: |
    文字列リテラルの **中** は、`javac` にとってただの文字の並び。全角スペースもそのまま表示される。

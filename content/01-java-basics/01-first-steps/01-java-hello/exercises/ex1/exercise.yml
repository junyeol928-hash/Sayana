title: 朝会のあいさつを出力する
className: MorningGreeting
difficulty: 1
problem: |
  配属初日の朝会で、ハルが画面共有しながらあいさつすることになりました。
  `main` メソッドを実行すると、次の **3行** が標準出力に表示されるようにしてください。

  ```text
  おはようございます。
  本日から開発部に配属されたハルです。
  よろしくお願いします。
  ```

  **ルール**
  - 1行ずつ `System.out.println` で出力する(最後の行も改行で終わること)
  - 文字は上の例と完全に一致させる(句読点は全角の「。」と「、」。行頭・行末に余計な空白を入れない)
  - `starter.java` の `// TODO:` の部分に書けばOK

  **ヒント**:3行なら `println` を3回。`print` だと改行されず、全部が1行につながってしまいます。

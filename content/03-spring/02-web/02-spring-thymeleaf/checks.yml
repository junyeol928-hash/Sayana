- after: テンプレートエンジンとは
  question: |
    サーバーを通さず、テンプレートのファイルをそのままブラウザで開いた。次の行は画面にどう見える?
    ```html
    <h1 th:text="${title}">ここにタイトル</h1>
    ```
  choices: ["「ここにタイトル」と出る", "`${title}` と出る", "何も出ない"]
  answer: 0
  explanation: |
    ブラウザは知らない属性の `th:text` を無視するので、タグの中のダミー文字がそのまま見える(ナチュラルテンプレート)。`${title}` は属性の値なので画面には出ない。サーバーで描画すると、Model の値に置き換わる。
- after: 繰り返しと条件分岐
  question: |
    `flag` が文字列の `"off"` のとき、出力に残るのは?
    ```html
    <b th:if="${flag}">A</b>
    <b th:unless="${flag}">B</b>
    ```
  choices: ["B だけ", "A だけ", "A と B の両方"]
  answer: 0
  explanation: |
    Thymeleaf の真偽は Java より緩く、文字列の `"off"` は偽(`"false"` や `"no"` も同じ)。だから `th:if` の A は出ず、`th:unless` の B が出る。「null でない文字列だから真」と考えると A を選んでしまう。
- after: よくあるミス
  question: |
    `${item.name}` を表示する行で、次のエラーが出た。原因は?
    ```text
    EL1007E: Property or field 'name' cannot be found on null
    ```
  choices:
    - "`item` 自体が null"
    - "`name` の綴り間違いか、getter が無い"
  answer: 0
  explanation: |
    `on null` は、`.name` の手前の `item` が null だったという意味。綴り間違いや getter が無いときは `EL1008E` で、`on object of type 'Item'` のように型の名前が出る。null かもしれないなら `${item?.name}` と書く。

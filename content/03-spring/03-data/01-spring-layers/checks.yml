- after: 3層の責務
  question: |
    「送料が無料になる金額を 5000 円から 3000 円に下げる」という変更。直すのはどの層?
  choices: ["Service", "Controller", "Repository"]
  answer: 0
  why:
    - ""
    - "金額の分岐を入出力の一部と読んだ答え。Controller は受け取りと返し方だけを受け持つ"
    - "金額の判断を DB 側の仕事と読んだ答え。Repository は保存と検索だけを受け持つ"
  explanation: |
    送料の決まりは業務ルールなので Service(レストランなら調理担当のレシピ)。
- after: 依存の向きは上から下へ一方通行
  question: |
    `OrderService` と `StockService` が、互いをコンストラクタで受け取っている。アプリを起動すると?
  choices: ["呼び出すと `StackOverflowError` になる", "`OrderService` と `StockService` を作れず、起動時に止まる", "片方を `null` のままにして起動する"]
  answer: 1
  why:
    - "互いに呼び合う無限の再帰と取り違えた答え"
    - ""
    - "作れる方から作り、相手は後回しにすると読んだ答え"
  explanation: |
    依存が循環すると、Bean を作る途中で相手がまだ作れず、起動の時点で止まる(`... form a cycle`)。
- after: パッケージ構成:層別か、機能別か
  question: |
    メインクラス(`@SpringBootApplication`)は `com.example.shop` にある。`com.example.order` に置いた `@Service` の `OrderService` は、コンポーネントスキャンで見つかる?
  choices: ["見つかる", "見つからない", "公開クラスなら見つかる"]
  answer: 1
  why:
    - "`com.example` までが同じなら範囲内と読んだ答え"
    - ""
    - "クラスを公開にすれば範囲の外でも見つかると読んだ答え。範囲を決めるのはパッケージの位置だけ"
  explanation: |
    スキャンの範囲はメインクラスのパッケージとその配下だけ。`com.example.order` は `com.example.shop` の外(隣)なので見つからない。`com.example.shop.order` のように配下へ置く。

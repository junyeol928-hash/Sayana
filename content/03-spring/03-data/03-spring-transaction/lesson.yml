id: spring-transaction
title: トランザクション
status: ready
minutes: 15
summary: "@Transactional で「全部成功か全部取り消し」を作る。検査例外ではロールバックされない罠、プロキシの仕組みと自己呼び出しの罠、readOnly・伝播・楽観ロックの入口まで。"
goals:
  - トランザクションと ACID を、振込の例で途中失敗したらどうなるかを使って説明できる
  - "@Transactional を Service に付け、既定でロールバックされる例外(RuntimeException と Error)と rollbackFor の使い方を説明できる"
  - プロキシの仕組みから、同じクラス内の呼び出しや private メソッドで @Transactional が効かない理由を説明できる
  - readOnly = true と、伝播の REQUIRED / REQUIRES_NEW の違いを使い分けられる
  - トランザクション内で外部 API やメール送信をしない理由と、@Version による楽観ロックの仕組みを説明できる
samples:
  - title: ロールバックされる例外・されない例外・効かない呼び出し
    description: |
      DB の代わりに「開始・コミット・ロールバック」を表示するトランザクションマネージャを登録して、`@Transactional` の動きを観察します。
      `Bean のクラス` に `SpringCGLIB` と出ているのが、Spring が差し替えたプロキシです。③ で検査例外なのにコミットされていること、④ でトランザクションが始まってすらいないことを確かめてから、コメントの「ここを変えてみよう」を試してください。
    libraries: [spring]
    code: |
      import org.springframework.context.annotation.*;
      import org.springframework.transaction.TransactionDefinition;
      import org.springframework.transaction.annotation.*;
      import org.springframework.transaction.support.*;

      // DB の代わりに「開始・コミット・ロールバック」を表示するだけの
      // トランザクションマネージャ(ここは読み飛ばしてOK)
      class LogTxManager extends AbstractPlatformTransactionManager {
          protected Object doGetTransaction() {
              return TransactionSynchronizationManager.isActualTransactionActive();
          }
          protected boolean isExistingTransaction(Object tx) {
              return (Boolean) tx;
          }
          protected void doBegin(Object tx, TransactionDefinition def) {
              System.out.println("  [TX] 開始" + (def.isReadOnly() ? "(readOnly)" : ""));
          }
          protected void doCommit(DefaultTransactionStatus s) {
              System.out.println("  [TX] コミット");
          }
          protected void doRollback(DefaultTransactionStatus s) {
              System.out.println("  [TX] ロールバック");
          }
      }

      @Configuration @EnableTransactionManagement
      class TxConfig {
          @Bean LogTxManager transactionManager() { return new LogTxManager(); }
      }

      class NotifyException extends Exception {   // 検査例外
          NotifyException(String m) { super(m); }
      }

      class OrderService {
          @Transactional(readOnly = true)
          public void find() { System.out.println("  注文を検索"); }

          @Transactional
          public void runtimeFail() {
              System.out.println("  注文を保存");
              throw new IllegalStateException("在庫不足");
          }

          // ここを変えてみよう:@Transactional(rollbackFor = NotifyException.class) にすると?
          @Transactional
          public void checkedFail() throws NotifyException {
              System.out.println("  注文を保存");
              throw new NotifyException("通知に失敗");
          }

          // ここを変えてみよう:outer にも @Transactional を付けると?
          public void outer() {
              runtimeFail();   // this.runtimeFail() なのでプロキシを通らない
          }
      }

      var ctx = new AnnotationConfigApplicationContext(TxConfig.class, OrderService.class);
      var service = ctx.getBean(OrderService.class);
      System.out.println("Bean のクラス: " + service.getClass().getSimpleName());

      System.out.println("① 参照だけ(readOnly)");
      service.find();
      System.out.println("② RuntimeException が起きた");
      try { service.runtimeFail(); } catch (RuntimeException e) { System.out.println("  例外: " + e.getMessage()); }
      System.out.println("③ 検査例外が起きた");
      try { service.checkedFail(); } catch (Exception e) { System.out.println("  例外: " + e.getMessage()); }
      System.out.println("④ 同じクラスの中から呼んだ");
      try { service.outer(); } catch (RuntimeException e) { System.out.println("  例外: " + e.getMessage()); }
      ctx.close();
quiz:
  - question: |
      `PaymentException` は `Exception` を継承した検査例外です。`charge` が `PaymentException` を投げたとき、在庫の更新はどうなる?
      ```java
      @Transactional
      public void order(Order o) throws PaymentException {
          stockRepository.reduce(o.item(), o.qty());
          payment.charge(o.amount());
      }
      ```
    choices:
      - "ロールバックされ、在庫は元に戻る"
      - "コミットされ、在庫は減ったままになる"
      - "コンパイルエラーになる"
      - "PaymentException が RuntimeException に包まれて投げ直され、ロールバックされる"
    answer: 1
    explanation: |
      `@Transactional` が既定でロールバックするのは RuntimeException と Error だけです。検査例外は「呼び出し側が対処する想定内の結果」とみなされ、例外は呼び出し元にそのまま伝わりつつ、トランザクションは **コミット** されます。
      在庫も戻したいなら `@Transactional(rollbackFor = PaymentException.class)` と書きます。`throws` を宣言しているのでコンパイルは通ります。Spring が例外を包み直すこともありません。
  - question: |
      `OrderService` は DI で受け取ったプロキシ経由で `importAll` が呼ばれます。このとき、トランザクションはどうなる?
      ```java
      public void importAll(List<Order> list) {
          for (Order o : list) {
              order(o);
          }
      }

      @Transactional
      public void order(Order o) { ... }
      ```
    choices:
      - "importAll 全体で1つのトランザクションになる"
      - "order の呼び出しごとに1つずつトランザクションが開始される"
      - "起動時にエラーになる"
      - "order の @Transactional は効かず、トランザクションは開始されない"
    answer: 3
    explanation: |
      `order(o)` は `this.order(o)` のことで、`this` はプロキシではなく本体です。プロキシを通らないので、`order` の `@Transactional` は **無視** されます(エラーも警告も出ません)。
      `importAll` に `@Transactional` を付ければ全体で1つになります。1件ずつ別のトランザクションにしたいなら、`order` を別の Bean に移して DI 経由で呼びます。
  - question: |
      「決済サービスの `PaymentException`(検査例外)が起きたときもロールバックしたい」場合の指定として正しいものは?
    choices:
      - "@Transactional(rollbackFor = PaymentException.class)"
      - "@Transactional(noRollbackFor = PaymentException.class)"
      - "@Transactional(readOnly = true)"
      - "@Transactional(propagation = Propagation.REQUIRES_NEW)"
    answer: 0
    explanation: |
      `rollbackFor` に指定した例外(とその子)が投げられるとロールバックされます。`rollbackFor = Exception.class` とすればすべての検査例外が対象になります。
      `noRollbackFor` は逆に「この例外ではロールバックしない」指定です。`readOnly` は参照専用の指定、`REQUIRES_NEW` は伝播(別のトランザクションを開始する)の指定で、どちらもロールバックの条件とは関係ありません。
  - question: |
      次のメソッドで `withdraw` が `IllegalStateException`(残高不足)を投げたとき、どうなる?
      ```java
      @Transactional
      public void transfer(long from, long to, int amount) {
          try {
              accountService.deposit(to, amount);
              accountService.withdraw(from, amount);
          } catch (IllegalStateException e) {
              log.warn("振込に失敗: {}", e.getMessage());
          }
      }
      ```
      (`accountService` は別の Bean で、`@Transactional` は付いていないものとする)
    choices:
      - "IllegalStateException なのでロールバックされる"
      - "warn ログが出た後、例外が呼び出し元に伝わる"
      - "例外を catch して正常終了したので、入金だけがコミットされる"
      - "何も更新されない"
    answer: 2
    explanation: |
      Spring がロールバックを判断するのは「メソッドから例外が **外へ出たか**」です。メソッドの中で catch して正常に戻ると成功とみなされ、先に実行した入金(`deposit`)だけがコミットされます。お金が湧いて出る事故です。
      RuntimeException でも、握りつぶせばロールバックされません。ロールバックしたいなら catch せずに投げる(ログを出すなら catch してから投げ直す)のが基本です。
  - question: |
      商品エンティティに `@Version private Integer version;` があります。A さんと B さんが **同じ version = 3** の商品を読み込み、A さんが先に価格を変更して保存しました。続けて B さんが在庫数を変更して保存すると?
    choices:
      - "B さんの変更で上書きされ、A さんの価格変更は消える"
      - "B さんの保存は失敗し、ObjectOptimisticLockingFailureException になる"
      - "A さんと B さんの変更が自動でマージされる"
      - "B さんの保存は、A さんのトランザクションが終わるまで待たされてから成功する"
    answer: 1
    explanation: |
      A さんの保存で version は 4 になりました。B さんの更新は `update ... where id = ? and version = 3` となり、該当行が0件なので、楽観ロックの失敗として `ObjectOptimisticLockingFailureException` が投げられます。
      `@Version` がなければ、後勝ちで A さんの変更が黙って消えます(ロストアップデート)。JPA が変更を自動でマージすることはありません。待たせてから進めるのは、行ロックを取る **悲観ロック** の動きです。
columns:
  - type: mistake
    title: "import を間違えて「readOnly が無い」と怒られる"
    body: |
      **Ctrl+Shift+O** で import を整理したら、`readOnly = true` が真っ赤に。

      ```text
      The attribute readOnly is undefined for the annotation type Transactional
      ```

      犯人は import。`@Transactional` は2つあるのです。

      - `org.springframework.transaction.annotation.Transactional`(Spring 版。`readOnly` や `rollbackFor` がある)
      - `jakarta.transaction.Transactional`(JTA 版。`rollbackOn` など)

      Spring Data JPA を入れると Hibernate 経由で JTA 版もクラスパスに入るので、import の候補で下を選ぶとこうなります。Spring は JTA 版も解釈しますが、属性名が違って混乱の元。**Spring 版に統一** しましょう。
  - type: genba
    title: 決済 API の遅延で、関係ない画面まで全部止まった
    body: |
      注文確定の `@Transactional` メソッドの中で、外部の決済 API を呼んでいたシステムの話です。ある日、決済会社の API が1回30秒かかるほど遅くなりました。すると注文画面だけでなく、商品一覧やログインまで止まり、ログにはこれが大量に並びました。

      ```text
      HikariPool-1 - Connection is not available,
      request timed out after 30000ms.
      ```

      トランザクション中は DB 接続を1本握りっぱなしです。Spring Boot の接続プール(HikariCP)の既定の上限は **10本**。決済待ちの注文が10件たまった時点で接続が枯渇し、DB を使う全画面が道連れになったのです。

      対策は、決済 API の呼び出しをトランザクションの外に出すこと(在庫の引き当てをコミット → 決済 → 結果をもう一度短いトランザクションで記録)と、外部呼び出しには必ずタイムアウトを設定することでした。
  - type: trivia
    title: テストに付けた @Transactional は最後に必ずロールバックする
    body: |
      同じ `@Transactional` でも、**テストメソッド** に付けると意味が変わります。Spring のテスト支援(TestContext フレームワーク)は、テストに付いた `@Transactional` を見つけると、テストの開始前にトランザクションを開始し、終了後に **成功しても必ずロールバック** します。

      おかげで、テストで INSERT したデータが DB に残らず、次のテストに影響しません。テストのたびに DB を作り直さなくて済む、よくできた仕組みです。コミットして中身を確かめたいときは `@Commit` を付けます。

      ただし落とし穴もあります。テスト全体が1つのトランザクションになるので、本番では起きる LazyInitializationException がテストでは起きなかったり、`REQUIRES_NEW` で別トランザクションにした処理だけはロールバックされずに残ったりします。「テストは通るのに本番で落ちる」ときは、ここを疑ってみてください。
sts:
  intro: |
    STS で口座の振込処理を作り、**@Transactional を付けない場合と付けた場合** で、途中で例外が起きたときに H2 のデータが残るか残らないかを確かめます。
    プロジェクトの作り方は前回の「Spring Data JPA」と同じです。メニュー名は英語 UI 表記で、日本語化している場合の表記を括弧で併記しています。
  steps:
    - title: プロジェクトを作って DB とログを設定する
      detail: |
        **File > New > Spring Starter Project**(ファイル > 新規 > Spring スターター・プロジェクト)で `tx-demo` を作ります(Java Version 21、依存は **Spring Data JPA**・**H2 Database**・**Spring Web**)。
        `src/main/resources/application.properties` に次を書きます。最後の行は、トランザクションの開始・コミット・ロールバックを Console に出す設定です。

        ```properties
        spring.datasource.url=jdbc:h2:file:./data/tx-demo
        spring.datasource.username=sa
        spring.datasource.password=
        spring.h2.console.enabled=true
        spring.jpa.hibernate.ddl-auto=update
        logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
        ```
    - title: エンティティ・Repository・Service を作る
      detail: |
        `com.example.demo` パッケージに次の3つを作ります(**New > Class** / **New > Interface**)。

        ```java
        @Entity
        public class Account {
            @Id @GeneratedValue(strategy = GenerationType.IDENTITY)
            private Long id;
            private String owner;
            private int balance;

            protected Account() { }
            public Account(String owner, int balance) {
                this.owner = owner;
                this.balance = balance;
            }
            public void withdraw(int amount) {
                if (balance < amount) throw new IllegalStateException("残高不足");
                balance -= amount;
            }
            public void deposit(int amount) { balance += amount; }
            public String getOwner() { return owner; }
            public int getBalance() { return balance; }
        }
        ```

        `AccountRepository` は `JpaRepository<Account, Long>` を継承するだけです。`TransferService` は **まだ @Transactional を付けずに** 書きます。

        ```java
        @Service
        public class TransferService {
            private final AccountRepository repo;
            public TransferService(AccountRepository repo) { this.repo = repo; }

            public void transfer(long fromId, long toId, int amount) {
                Account from = repo.findById(fromId).orElseThrow();
                from.withdraw(amount);
                repo.save(from);                               // 引き出しを保存
                Account to = repo.findById(toId).orElseThrow(); // 無い口座なら例外
                to.deposit(amount);
                repo.save(to);
            }
        }
        ```
    - title: CommandLineRunner で「存在しない口座への振込」を試す
      detail: |
        `TxDemoApplication.java` に次の Bean を追加します。

        ```java
        @Bean
        CommandLineRunner demo(AccountRepository repo, TransferService service) {
            return args -> {
                if (repo.count() == 0) {
                    repo.save(new Account("A", 10000));   // id = 1
                    repo.save(new Account("B", 0));       // id = 2
                }
                try {
                    service.transfer(1, 999, 3000);       // 999 番の口座は無い
                } catch (RuntimeException e) {
                    System.out.println("振込失敗: " + e);
                }
                repo.findAll().forEach(a ->
                    System.out.println(a.getOwner() + ": " + a.getBalance()));
            };
        }
        ```
    - title: "@Transactional なしで実行し、お金が消えるのを見る"
      detail: |
        プロジェクトを右クリックして **Run As > Spring Boot App**(実行 > Spring Boot アプリケーション)で起動します。
        **Console**(コンソール)に `振込失敗: java.util.NoSuchElementException: No value present` の後、`A: 7000` と `B: 0` が出ます。**3000 円が消えました。**
        DEBUG ログを見ると、`Creating new transaction with name [org.springframework.data.jpa.repository.support.SimpleJpaRepository.save]` が `save` のたびに出ていて、引き出しだけが先にコミットされたことが分かります。

        ブラウザで `http://localhost:8080/h2-console` を開き、**JDBC URL** を `jdbc:h2:file:./data/tx-demo`、**User Name** を `sa` にして **Connect**。`SELECT * FROM ACCOUNT;` で A の残高が 7000 になっていることも確かめます。
    - title: "@Transactional を付けて、データが残らないことを確かめる"
      detail: |
        H2 コンソールで `UPDATE ACCOUNT SET BALANCE = 10000 WHERE ID = 1;` を実行して残高を戻してから、アプリを停止します(Console の赤い四角 **Terminate** ボタン)。

        `transfer` メソッドに `@Transactional`(`org.springframework.transaction.annotation.Transactional` を import)を付けて、もう一度 **Run As > Spring Boot App**。
        今度は `A: 10000`、`B: 0` のままです。DEBUG ログに `Creating new transaction with name [com.example.demo.TransferService.transfer]` と `Initiating transaction rollback` が出ていれば成功です。H2 コンソールでも A が 10000 のままであることを確認しましょう。
    - title: 検査例外ではロールバックされないことを確かめる
      detail: |
        `transfer` の2回目の `orElseThrow()` を `orElseThrow(() -> new Exception("口座がありません"))` に変え、メソッドに `throws Exception` を付けます(CommandLineRunner の `catch` も `Exception` に変える)。
        A の残高を 10000 に戻して再起動すると、`@Transactional` が付いているのに `A: 7000` になり、ログには `Initiating transaction commit` が出ます。
        最後に `@Transactional(rollbackFor = Exception.class)` に変えて、ロールバックされるようになることを確かめます。
checklist:
  - key: tx-without
    text: "@Transactional なしで途中で例外を起こし、引き出しだけがコミットされて H2 のデータが 7000 円になることを確認した"
  - key: tx-with
    text: "@Transactional を付けると同じ失敗でロールバックされ、H2 のデータが 10000 円のまま残ることを確認した"
  - key: tx-log
    text: JpaTransactionManager の DEBUG ログで、Creating new transaction と Initiating transaction rollback / commit を読めた
  - key: tx-checked
    text: 検査例外ではコミットされることを確認し、rollbackFor を指定してロールバックさせられた
  - key: tx-proxy
    text: 同じクラス内の呼び出しや private メソッドに @Transactional が効かない理由を、プロキシの仕組みから説明できる
  - key: tx-external
    text: トランザクションの中で外部 API やメール送信をしてはいけない理由を説明できる

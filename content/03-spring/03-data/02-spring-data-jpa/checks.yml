- after: エンティティ:クラスをテーブルに対応づける
  question: |
    `Employee` 側が次の形のとき、`Department` 側の `@OneToMany(mappedBy = ...)` に書くのは?
    ```java
    @ManyToOne
    @JoinColumn(name = "dept_id")
    private Department belongsTo;
    ```
  choices: ["`\"dept_id\"`", "`\"belongsTo\"`", "`\"department\"`"]
  answer: 1
  why:
    - "外部キーの列名を書くと読んだ答え。`dept_id` は `@JoinColumn` の列名で、`mappedBy` には使わない"
    - ""
    - "相手の型 `Department` から名前が決まると読んだ答え"
  explanation: |
    `mappedBy` には、外部キーを持つ側(`Employee`)の **フィールド名** を書く。ここでは `belongsTo`。
- after: JpaRepository:継承するだけで CRUD
  question: |
    `findById(5L)` で読んだ社員の名前を `setName` で変えて、`save` に渡した。DB の行はどうなる?
  choices: ["`id` 5 の行が更新される(`UPDATE`)", "新しい行が足される(`INSERT`)", "同じ `id` の行がもうあるので、主キーの重複で例外になる"]
  answer: 0
  why:
    - ""
    - "`save` はいつも新しく足すと読んだ答え"
    - "同じ `id` で `INSERT` して主キーがぶつかると読んだ答え"
  explanation: |
    `save` は `id` を見て決める。`null` なら新規として `INSERT`、値があれば既存として `UPDATE`(`merge`)。DB から読んだ社員には `id` に 5 が入っているので、同じ行が更新される。
- after: 現場の三大落とし穴
  question: |
    社員 5 人のうち 1 人は部署が未設定(`department_id` が `null`)。次の JPQL で取れる社員は何人?
    ```java
    @Query("select e from Employee e join fetch e.department")
    ```
  choices: ["5 人", "4 人", "部署が未設定の社員がいるので、例外になる"]
  answer: 1
  why:
    - "部署の無い社員も含まれると読んだ答え"
    - ""
    - "`null` の部署に触って落ちると読んだ答え"
  explanation: |
    `join fetch` は内部結合なので、部署の無い社員は結果から消えて 4 人。全員を取るなら `left join fetch` にする。

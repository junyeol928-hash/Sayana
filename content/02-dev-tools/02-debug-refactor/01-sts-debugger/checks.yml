- after: 条件付きブレークポイントと例外ブレークポイント
  question: |
    どこかで `NullPointerException` が起きるが、どの行か目星がつかない。投げられた瞬間の変数を見たい。使うのは?
  choices: ["例外ブレークポイント", "条件付きブレークポイント", "Drop to Frame"]
  answer: 0
  why:
    - ""
    - "条件で絞れば見つかると考えた答え。条件付きは置いた行でしか止まらないので、行の目星が要る"
    - "やり直しの機能と取り違えた答え。Drop to Frame はメソッドの先頭から実行し直すもので、例外の場所は探さない"
  explanation: |
    **Run > Add Java Exception Breakpoint...** で `NullPointerException` を選ぶと、投げられた瞬間に止まり、そのときの変数が全部見える。

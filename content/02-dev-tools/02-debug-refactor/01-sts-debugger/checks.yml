- before: "53.333333333333336"
  hides: 1
  question: |
    `average(new int[] {80, 90, 70})` を出力すると、何が出る?
    ```java
    static double average(int[] a) {
        int sum = 0;
        for (int i = 1; i < a.length; i++) {
            sum += a[i];
        }
        return (double) sum / a.length;
    }
    ```
  choices: ["53.333333333333336", "53.0", "ArrayIndexOutOfBoundsException で落ちる"]
  answer: 0
  why:
    - ""
    - "整数どうしの割り算と読んだ答え。`(double)` が先に `sum` を double にするので、小数まで出る"
    - "`i` が 1 から始まるぶん、最後に `a[3]` を読むと考えた答え。`i < a.length` なので `i` は 2 で止まる"
  explanation: |
    `i` が 1 から始まるので、`a[0]` の 80 が足されない。90 + 70 = 160 を 3 で割って 53.333333333333336。

# ローカル版 Java道場から移した教材(scripts/import-local-dojo.mjs で生成。以後は手で直してよい)
- title: "デバッグとコードの追い方"
  intro: "Spring Boot の Controller で受け取った値がおかしいときは、まずその Controller のメソッドにブレークポイントを置き、リクエストを送って止め、そこから Service・Repository へステップインして追っていきます。"
  code: |
    @RestController
    public class UserController {

        private final UserService userService;

        public UserController(UserService userService) {
            this.userService = userService;
        }

        @PostMapping("/users")
        public ResponseEntity<String> create(@RequestBody UserRequest request) {
            log.debug("received request: {}", request);
            String userId = userService.register(request);
            return ResponseEntity.ok(userId);
        }
    }
  notes:
    10: "ここにブレークポイントを置けば、リクエストを受け取った瞬間の request の中身を確認できる"
    12: "デバッグ用のログ。application.yml でこのクラスのログレベルを DEBUG にしないと出力されない"
    13: "ここでステップインすれば、UserService.register の中に処理を追える"
  points:
    - "Controller のメソッドの先頭にブレークポイントを置き、リクエストの値を最初に確認する"
    - "ステップインで Service・Repository と、呼び出しの深いところまで追えるようにしておく"
    - "log.debug の呼び出しがあれば、それがどのログレベルで出力されるか(application.yml)を確認する"
    - "例外が出たら、まずスタックトレースの一番上(自分のコードの行)から読む"

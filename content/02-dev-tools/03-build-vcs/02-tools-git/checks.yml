- after: Git の基本概念:3つの場所と2つのリポジトリ
  question: |
    `git status` がこう出ている。この状態で `git commit -m "…"` すると、コミットに入るのは?
    ```text
    Changes to be committed:
            modified:   README.md
    Changes not staged for commit:
            modified:   ShippingService.java
    ```
  choices: ["README.md だけ", "ShippingService.java だけ", "両方"]
  answer: 0
  why:
    - ""
    - "not staged の側がコミットされると取り違えた答え。ステージに無い変更は入らない"
    - "変えたファイルが全部入ると考えた答え。それは `git commit -a` の動き"
  explanation: |
    コミットに入るのは、ステージにある `Changes to be committed` の側だけ。`ShippingService.java` の変更は作業ツリーに残る。
- after: .gitignore:コミットしないものを決める
  question: |
    `.gitignore` に `data/`(先頭の `/` なし)と書いた。スマホ版の教材フォルダ `m/data/` はどうなる?
  choices:
    - "無視される"
    - "無視されない(リポジトリ直下の data だけが対象)"
    - "直下の data も含め、どれも無視されない"
  answer: 0
  why:
    - ""
    - "`/` が無くても直下だけと読んだ答え。直下だけにするのは、先頭に `/` を付けた `/data/`"
    - "先頭に `/` が無い行は効かないと読んだ答え。`/` は直下に絞る印で、無くても行は効く"
  explanation: |
    `/` の無い `data/` は、どの階層にある `data` フォルダにも当たる。だから `m/data/` まで無視される。
- after: コンフリクトの解消
  question: |
    `git pull` で相手の変更をマージしたら、設定ファイルがこうなった。あなたが書いた値は?
    ```text
    <<<<<<< HEAD
    timeout=30
    =======
    timeout=60
    >>>>>>> 4f2a9c1
    ```
  choices: ["`timeout=30`", "`timeout=60`", "この印だけでは、どちらが自分の値か分からない"]
  answer: 0
  why:
    - ""
    - "`=======` の下を自分の側と取り違えた答え。下は、取り込んだ相手の変更"
    - "印は誰の変更かを示さないと考えた答え。`<<<<<<< HEAD` の側が、自分のブランチの内容"
  explanation: |
    `<<<<<<< HEAD` から `=======` までが自分の変更、`=======` の下が取り込んだ相手の変更。どちらを残すかは相手と確認して決め、印の行を消してからコミットする。設定ファイルは印が残ってもコンパイルエラーにならないので、消し忘れに気をつける。

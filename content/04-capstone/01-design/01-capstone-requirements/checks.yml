- after: ER 図:テーブルと関係
  question: |
    下書きのハルの申請が「申請 → 差戻し → 再申請 → 承認」と 4 回操作された。`APPROVAL_REQUEST` と `APPROVAL_HISTORY` の行は何行?
  choices: ["申請 1 行・履歴 4 行", "申請 4 行・履歴 4 行", "申請 1 行・履歴 1 行"]
  answer: 0
  explanation: |
    申請テーブルは「今の姿」なので 1 行を上書きし、履歴テーブルは操作のたびに 1 行足す。申請が 4 行だと「今の姿」が 4 つになり、履歴が 1 行だと最初の差戻しの経緯が消える。
- after: 状態遷移図:enum に写せる形で
  question: |
    差し戻された(`RETURNED`)申請に、申請者ができる操作は?
  choices: ["再申請も取下げもできる", "再申請だけ", "どちらもできない"]
  answer: 0
  explanation: |
    図の `RETURNED` からは `SUBMITTED`(再申請)と `WITHDRAWN`(取下げ)の 2 本の矢印が出ている。取下げの矢印が無いのは申請中(`SUBMITTED`)のほうで、そちらと取り違えると「再申請だけ」になる。
- after: 業務ルールと「仕様の穴」
  question: |
    モカが差し戻し、ハルが直して再申請し、ボスが承認した。この申請の `approver` 列に入っているのは?
  choices: ["ボス", "モカ", "空(null)のまま"]
  answer: 0
  explanation: |
    `approver` は担当者ではなく「最後に判断した人」なので、承認したボスで上書きされる。最初に差し戻したモカのことは、履歴テーブルの差戻しの行に残る。

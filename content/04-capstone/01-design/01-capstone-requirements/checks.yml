- after: ER 図:テーブルと関係
  question: |
    下書きのハルの申請が「申請 → 差戻し → 再申請 → 承認」と 4 回操作された。`APPROVAL_REQUEST` と `APPROVAL_HISTORY` の行は何行?
  choices: ["申請 1 行・履歴 4 行", "申請 4 行・履歴 4 行", "申請 1 行・履歴 1 行"]
  answer: 0
  why:
    - ""
    - "操作のたびに申請も 1 行足すと読んだ答え。申請は同じ 1 行を書き換える"
    - "履歴も上書きすると読んだ答え。差戻しの経緯も消えずに残る"
  explanation: |
    申請テーブルは「今の姿」なので 1 行を上書きし、履歴テーブルは操作のたびに 1 行足す。4 回の操作で、申請 1 行・履歴 4 行。
- after: 状態遷移図:enum に写せる形で
  question: |
    差し戻された(`RETURNED`)申請に、申請者ができる操作は?
  choices: ["再申請も取下げもできる", "再申請だけ", "どちらもできない"]
  answer: 0
  why:
    - ""
    - "取下げの矢印が無い申請中(`SUBMITTED`)と取り違えた答え。`RETURNED` からは取下げの矢印も出ている"
    - "差戻しで手詰まりと読んだ答え。差戻しは行き止まりの状態ではない"
  explanation: |
    図の `RETURNED` からは、`SUBMITTED`(再申請)と `WITHDRAWN`(取下げ)の 2 本の矢印が出ている。
- after: 業務ルールと「仕様の穴」
  question: |
    モカが差し戻し、ハルが直して再申請し、ボスが承認した。この申請の `approver` 列に入っているのは?
  choices: ["ボス", "モカ", "空(`null`)のまま"]
  answer: 0
  why:
    - ""
    - "`approver` を担当者と読んだ答え。モカの差戻しは履歴のほうに残る"
    - "再申請で空に戻ったきりと考えた答え。承認した時点で、判断した人(ボス)が入る"
  explanation: |
    `approver` は担当者ではなく「最後に判断した人」なので、承認したボスで上書きされる。それまでの経緯は履歴テーブルに残る。

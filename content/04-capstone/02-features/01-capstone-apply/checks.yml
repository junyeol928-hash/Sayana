  choices: ["一覧を読み直すだけで、下書きは増えない", "POST がもう一度送られ、同じ下書きがもう 1 件できる", "下書きは増えないが、「下書きを保存しました」がもう一度出る"]
  answer: 0
  why:
    - ""
    - "保存の POST の画面のままと考えた答え。ブラウザはもう一覧を開き直している"
    - "メッセージも残ると考えた答え。フラッシュ属性は、リダイレクト先で 1 回使われたら消える"
  explanation: |
    保存後は `redirect:/requests` でブラウザに GET し直させている(PRG)。再読み込みで送り直すのは、一覧の GET だけ。
- after: 画面:new.html と list.html
  question: |
    件名と理由だけ入れ、種類は「選択してください」、金額は空のまま送った。出るエラーは?
  choices: ["「種類を選んでください」だけ", "空文字を `enum` に変換できず 400 Bad Request", "「種類を選んでください」と「経費精算・備品購入は金額が必須です」"]
  answer: 0
  why:
    - ""
    - "空文字は `enum` に変換できないと考えた答え。変換は失敗せず、エラーは検証の側で出る"
    - "金額のエラーも重なると読んだ答え。種類が未選択なら、相関チェックは `@NotNull` に任せて `true` を返す"
  explanation: |
    「選択してください」の空文字は、`enum` への変換で `null` になる。だから `@NotNull` の「種類を選んでください」だけが出る。

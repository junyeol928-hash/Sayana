- after: RequestForm:入力ルールと相関チェック
  question: |
    種類に「休暇」を選び、金額欄に `5000` と入れたまま保存した(件名・理由は入力済み)。どうなる?
  choices: ["エラーにならず、金額は `null` で保存される", "相関チェックのエラーになる", "エラーにならず、金額 5000 円で保存される"]
  answer: 0
  why:
    - ""
    - "金額を入れたこと自体がエラーと読んだ答え。休暇では金額を見ない"
    - "入れた金額がそのまま残ると考えた答え。保存の前に捨てられる"
  explanation: |
    相関チェックは金額の要らない種類なら `true` を返すので、エラーは出ない。保存では `toEntity()` が `type.requiresAmount() ? amount : null` で休暇の金額を捨てる。

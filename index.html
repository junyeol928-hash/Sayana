<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特別なご案内♡</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
    background-color: #ffe6ea; /* 可愛い薄ピンクの背景 */
    color: #5a4b4d;
    text-align: center;
    padding: 10vh 20px;
    margin: 0;
  }
  .container {
    max-width: 400px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  h2 {
    font-size: 1.3rem;
    margin-bottom: 20px;
  }
  img {
    width: 100%;
    border-radius: 15px;
    margin: 10px 0 20px 0;
    object-fit: cover;
    max-height: 250px;
  }
  .btn {
    padding: 12px 30px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
    font-weight: bold;
    transition: 0.3s;
  }
  .btn-yes {
    background-color: #ff758c;
    color: white;
    box-shadow: 0 4px 10px rgba(255, 117, 140, 0.4);
  }
  .btn-yes:hover {
    background-color: #ff526f;
    transform: scale(1.05);
  }
  /* Noボタンがふわっと消えるアニメーション */
  .btn-no {
    background-color: #cccccc;
    color: white;
    position: relative;
    animation: fadeOut 2.5s forwards;
    animation-delay: 1.0s; /* 開いてから少しだけ待って消え始める */
  }
  @keyframes fadeOut {
    0% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; pointer-events: none; }
  }
  .hidden { display: none; }
  input[type="date"], input[type="time"] {
    padding: 12px;
    margin: 10px 0;
    width: 100%;
    border: 2px solid #ffe6ea;
    border-radius: 10px;
    box-sizing: border-box;
    font-size: 16px;
    color: #5a4b4d;
  }
  input[type="date"]:focus, input[type="time"]:focus {
    outline: none;
    border-color: #ff758c;
  }
  .heart { color: #ff758c; font-size: 28px; margin-top: 0; }
  .result-box {
    background: #fff0f3;
    padding: 15px;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    margin: 20px 0;
    color: #ff526f;
  }
  .screenshot-text {
    font-weight: bold;
    color: #ff758c;
    font-size: 1.1rem;
    animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
  }
</style>
</head>

<div id="step2" class="container hidden">

  <input type="date" id="dateInput">
  <input type="time" id="timeInput">

<!-- 画面3: 完了画面 -->
<div id="step3" class="container hidden">
  <h2 class="heart">I love you♡</h2>
  <p>デートの予定が決まりました！</p>
  <div class="result-box" id="resultDateTime"></div>
  <p class="screenshot-text">この画面をスクショしてね！📸</p>
</div>

<script>
  function nextStep(step) {
    if (step === 2) {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    } else if (step === 3) {
      const dateVal = document.getElementById('dateInput').value;
      const timeVal = document.getElementById('timeInput').value;
      
      if(!dateVal || !timeVal) {
        alert('日にちと時間を両方教えてね！');
        return;
      }

      // 日付を見やすく整形
      const dateObj = new Date(dateVal);
      const formattedDate = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
      
      document.getElementById('resultDateTime').innerText = `${formattedDate} ${timeVal}〜`;
      
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
    }
  }
</script>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f9fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1724" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Java道場">
    <title th:text="${title} + ' | Java道場'">Java道場</title>
    <link rel="icon" th:href="@{/img/icon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js" defer></script>
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="site-header" th:fragment="header">
    <!--/* 線のアイコン(スマホ版の index.html と同じ形) */-->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.5 7 3.5 12l5 5"/><path d="M15.5 7l5 5-5 5"/><path d="M13.5 4.5l-3 15"/></symbol>
        <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></symbol>
        <symbol id="i-terms" viewBox="0 0 24 24"><path d="M5 4.5h11a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11"/><path d="M9 8.5h6"/></symbol>
        <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.5 4h5"/><path d="M10.5 4v5.5L5.5 18a1.5 1.5 0 0 0 1.3 2.2h10.4a1.5 1.5 0 0 0 1.3-2.2l-5-8.5V4"/><path d="M8 14.5h8"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
        <symbol id="i-cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-5 4z"/></symbol>
    </svg>
    <a class="visually-hidden" href="#main">本文へ</a>
    <div class="header-inner">
        <a class="logo" th:href="@{/}"><img class="logo-mark" th:src="@{/img/icon.svg}" alt="" width="28" height="28"><span>Java<b>道場</b></span></a>
        <nav class="main-nav" aria-label="メニュー">
            <a th:href="@{/}">ホーム</a>
            <a th:href="@{/reading}">読解</a>
            <a th:href="@{/review}">復習<span class="count" th:if="${dueCount > 0}" th:text="${dueCount}">3</span></a>
            <a th:href="@{/glossary}">用語集</a>
            <a th:href="@{/history}">提出履歴</a>
            <a th:href="@{/playground}">プレイグラウンド</a>
        </nav>
        <div class="header-status">
            <span class="streak" th:classappend="${streak == 0} ? 'zero'" th:title="'連続学習 ' + ${streak} + '日'">連続 <b th:text="${streak}">0</b> 日</span>
            <!--/* AI の設定の有無はヘッダーに出さない(学習者には雑音)。AI の入口(チューターの欄・講評のボタン)の中で知らせる */-->
        </div>
    </div>
    <!--/* スマホ用の下部ナビ(狭い画面だけ表示) */-->
    <nav class="bottom-nav" aria-label="メニュー(スマホ)">
        <a th:href="@{/}"><span class="bn-icon"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></span><span>ホーム</span></a>
        <a th:href="@{/reading}"><span class="bn-icon"><svg class="icon" aria-hidden="true"><use href="#i-code"/></svg></span><span>読解</span></a>
        <a th:href="@{/review}"><span class="bn-icon"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg><span class="bn-count" th:if="${dueCount > 0}" th:text="${dueCount}">3</span></span><span>復習</span></a>
        <a th:href="@{/glossary}"><span class="bn-icon"><svg class="icon" aria-hidden="true"><use href="#i-terms"/></svg></span><span>用語集</span></a>
        <a th:href="@{/playground}"><span class="bn-icon"><svg class="icon" aria-hidden="true"><use href="#i-flask"/></svg></span><span>試す</span></a>
    </nav>
</header>

<footer class="site-footer" th:fragment="footer">
    <span>Java道場 — ローカル専用の学習アプリ(127.0.0.1)・
        <a href="https://junyeol928-hash.github.io/Sayana/m/" target="_blank" rel="noopener">スマホ版(オフライン対応)</a></span>
    <form method="post" th:action="@{/content/reload}" class="inline">
        <button class="link-button" type="submit" title="content/ 配下の教材を読み直します">教材を再読み込み</button>
    </form>
</footer>
</body>
</html>

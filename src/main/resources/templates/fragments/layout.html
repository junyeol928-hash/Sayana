<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6b4226">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Java道場">
    <title th:text="${title} + ' | Java道場'">Java道場</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js" defer></script>
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <a class="logo" th:href="@{/}">☕ Java道場</a>
        <nav class="main-nav">
            <a th:href="@{/}">ダッシュボード</a>
            <a th:href="@{/review}">復習<span class="count" th:if="${dueCount > 0}" th:text="${dueCount}">3</span></a>
            <a th:href="@{/history}">提出履歴</a>
            <a th:href="@{/playground}">プレイグラウンド</a>
        </nav>
        <div class="header-status">
            <span class="streak" th:title="'連続学習 ' + ${streak} + '日'">🔥 <b th:text="${streak}">0</b>日</span>
            <span th:if="${aiAvailable}" class="ai-badge on" title="ANTHROPIC_API_KEY が設定されています">AI ON</span>
            <span th:unless="${aiAvailable}" class="ai-badge off" title="ANTHROPIC_API_KEY が未設定です。AI機能以外は使えます">AI OFF</span>
        </div>
    </div>
    <!--/* スマホ用の下部ナビ(狭い画面だけ表示) */-->
    <nav class="bottom-nav" aria-label="メニュー">
        <a th:href="@{/}"><span class="bn-icon">🏠</span><span>ホーム</span></a>
        <a th:href="@{/review}"><span class="bn-icon">🔁<span class="bn-count" th:if="${dueCount > 0}" th:text="${dueCount}">3</span></span><span>復習</span></a>
        <a th:href="@{/history}"><span class="bn-icon">📝</span><span>履歴</span></a>
        <a th:href="@{/playground}"><span class="bn-icon">🧪</span><span>試す</span></a>
    </nav>
</header>

<footer class="site-footer" th:fragment="footer">
    <span>Java道場 — ローカル専用の学習アプリ(127.0.0.1)</span>
    <form method="post" th:action="@{/content/reload}" class="inline">
        <button class="link-button" type="submit" title="content/ 配下の教材を読み直します">教材を再読み込み</button>
    </form>
</footer>
</body>
</html>

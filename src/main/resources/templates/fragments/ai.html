<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* チャットのメッセージ(追加分) */-->
<th:block th:fragment="chatMessages">
    <div th:each="m : ${messages}" class="chat-msg" th:classappend="${m.user} ? 'from-user' : 'from-ai'">
        <div class="chat-who" th:text="${m.user} ? 'あなた' : '☕ モカ先輩(AI)'"></div>
        <div class="chat-body md" th:if="${m.user}" th:text="${m.content}"></div>
        <div class="chat-body md" th:unless="${m.user}" th:utext="${ui.md(m.content)}"></div>
    </div>
</th:block>

<!--/* AI の回答(レビュー・エラー翻訳) */-->
<div th:fragment="answer" class="ai-answer">
    <div class="ai-answer-title">🤖 <span th:text="${title}"></span></div>
    <div class="md" th:utext="${ui.md(text)}"></div>
</div>

<div th:fragment="error" class="ai-error">⚠️ <span th:text="${error}"></span></div>

<th:block th:fragment="empty"></th:block>

<!--/* レッスン横のチューター */-->
<aside th:fragment="tutor(lessonId, messages)" class="tutor" id="tutor">
    <div class="tutor-head">
        <span>☕ AIチューター</span>
        <button type="button" class="tutor-close" data-tutor-toggle aria-label="閉じる">✕</button>
        <form th:if="${aiAvailable}" class="inline" hx-post="/ai/chat/clear" hx-target="#chat-log" hx-confirm="このレッスンの会話を消しますか?">
            <input type="hidden" name="lessonId" th:value="${lessonId}">
            <button class="link-button small" type="submit">会話をクリア</button>
        </form>
    </div>
    <div class="chat-log" id="chat-log">
        <div class="chat-msg from-ai intro">
            <div class="chat-who">☕ モカ先輩(AI)</div>
            <div class="chat-body">分からないところは気軽に聞いて。答えをそのまま教えるんじゃなくて、考え方のほうを一緒に整理するからね。</div>
        </div>
        <th:block th:replace="~{fragments/ai :: chatMessages}"></th:block>
    </div>
    <form th:if="${aiAvailable}" class="chat-form" hx-post="/ai/chat" hx-target="#chat-log" hx-swap="beforeend scroll:#chat-log:bottom"
          hx-vals='js:{code: window.dojo ? window.dojo.codeForTutor() : ""}' hx-disabled-elt="find button"
          hx-on::after-request="if (event.detail.successful) this.querySelector('textarea').value = ''">
        <input type="hidden" name="lessonId" th:value="${lessonId}">
        <textarea name="question" rows="3" placeholder="例: なぜ int 同士の割り算は小数にならないの?(Ctrl+Enterで送信)" required></textarea>
        <div class="chat-actions">
            <label class="small"><input type="checkbox" id="send-code" checked> いま書いているコードも見せる</label>
            <button class="btn primary small" type="submit">送信</button>
        </div>
        <div class="htmx-indicator muted small">モカ先輩が考え中…</div>
    </form>
    <div th:unless="${aiAvailable}" class="ai-off-note">
        <p><b>AI機能はオフです。</b></p>
        <p class="small">環境変数 <code>ANTHROPIC_API_KEY</code> を設定してアプリを再起動すると、チューター・段階ヒント・コードレビュー・エラー翻訳・類題生成が使えます(手順は README)。</p>
    </div>
</aside>
</body>
</html>

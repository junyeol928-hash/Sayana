<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="quizAnswer" class="review-verdict" th:attr="data-answer=${question.answer}, data-chosen=${choice}">
    <div class="q-explain" th:classappend="${correct} ? 'correct' : 'wrong'">
        <span class="q-mark" th:text="${correct} ? '✓ 正解' : '× 不正解'"></span>
        <div class="explanation md" th:utext="${question.explanationHtml}"></div>
    </div>
    <p class="review-source">出どころ: <a th:href="@{/lessons/{id}(id=${lesson.id})}" th:text="${lesson.title}"></a>(読み直す)</p>
    <div class="review-next"><p class="review-note">次回: <b th:text="${reviewLabel}"></b></p>
        <a class="btn primary" th:href="@{/review}">次の復習へ</a></div>
</div>
</body>
</html>

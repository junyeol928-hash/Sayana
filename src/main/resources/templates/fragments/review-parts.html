<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 復習の上の行: 残りの数と、次の区切り(10 問)までの進み。答えたあとは hx-swap-oob で差し替える -->
<p th:fragment="progress(left, n, oob)" class="review-progress" id="review-progress" th:attr="hx-swap-oob=${oob ? 'true' : null}"
   th:with="inBlock=${oob ? ((n - 1) % 10) + 1 : n % 10}">残り <b th:text="${left}"></b> 問<span th:if="${n > 0}">今日 <th:block th:text="${inBlock}"></th:block> / <th:block th:text="${inBlock + left < 10 ? inBlock + left : 10}"></th:block><th:block th:if="${n >= 10}" th:text="|(${n} 問済み)|"></th:block></span></p>

<!-- 復習の段階を運針で: 1・3・7・14 日の 4 目(縫えた目は糸、今回の目に朱の玉結び、まだの目は針穴)。問いのカードの上端に置く -->
<div th:fragment="stitch(item)" class="review-stitch" th:with="s=${item.stage > 3 ? 3 : item.stage}, days=${ {1, 3, 7, 14} }">
    <div class="unshin" role="img" style="--steps: 4" th:attr="aria-label='4 回のうち ' + ${s + 1} + ' 回目の復習'">
        <i th:each="d, ds : ${days}" th:classappend="${ds.index < s} ? 'sewn' : (${ds.index == s} ? 'now' : '')"></i>
    </div>
    <p class="unshin-cap" aria-hidden="true"><span><th:block th:text="${days[s]}"></th:block> 日後の復習(4 回のうち <b th:text="${s + 1} + ' 回目'"></b>)</span>
        <span th:text="${s == 3} ? '正解で卒業' : '卒業まで あと ' + ${4 - s} + ' 回'"></span></p>
</div>

<!-- 間違えた問題の行: レッスン名・どう読み違えたか(無ければ問いの書き出し)・読み直す(その問いそのものへ)。
     shown 件まで行に出し(区切りは 3、今日の終わりは 5)、超える分は「ほか n 問(まだ k)」の畳みの中に同じ行で(スマホ版と同じ) -->
<th:block th:fragment="missed(list, shown)" th:if="${list != null and !list.isEmpty()}">
    <ul class="missed-list" aria-label="間違えた問題">
        <li th:each="m, ms : ${list}" th:if="${ms.index < shown}"><span class="missed-mark" aria-hidden="true"></span><span class="missed-body"><b><th:block th:text="${m.lessonTitle()}"></th:block><span class="missed-basted" th:if="${m.retry() == true}">仮縫いできた</span><span class="missed-again" th:if="${m.retry() == false}">まだ</span></b><span class="missed-read"><span class="missed-why" th:if="${m.why()}">あなたの読み</span><th:block th:if="${m.why()}" th:utext="${m.text()}"></th:block><th:block th:unless="${m.why()}" th:text="${m.text()}"></th:block></span></span><a class="missed-link" th:href="@{'/lessons/' + ${m.lessonId()} + ${m.anchor()}}">読み直す</a></li>
    </ul>
    <details class="missed-more" th:if="${list.size() > shown}">
        <summary th:with="still=${list.subList(shown, list.size()).?[retry() == false].size()}"
                 th:text="${still > 0} ? |ほか ${list.size() - shown} 問(まだ ${still})| : |ほか ${list.size() - shown} 問|"></summary>
        <ul class="missed-list" aria-label="間違えた問題の続き">
            <li th:each="m, ms : ${list}" th:if="${ms.index >= shown}"><span class="missed-mark" aria-hidden="true"></span><span class="missed-body"><b><th:block th:text="${m.lessonTitle()}"></th:block><span class="missed-basted" th:if="${m.retry() == true}">仮縫いできた</span><span class="missed-again" th:if="${m.retry() == false}">まだ</span></b><span class="missed-read"><span class="missed-why" th:if="${m.why()}">あなたの読み</span><th:block th:if="${m.why()}" th:utext="${m.text()}"></th:block><th:block th:unless="${m.why()}" th:text="${m.text()}"></th:block></span></span><a class="missed-link" th:href="@{'/lessons/' + ${m.lessonId()} + ${m.anchor()}}">読み直す</a></li>
        </ul>
    </details>
</th:block>

<div th:fragment="quizAnswer" class="review-verdict" th:attr="data-answer=${question.answer}, data-chosen=${choice}, data-next-days=${nextDays}, data-next-step=${nextStep}, data-graduated=${graduatedNow}">
    <div class="q-explain" tabindex="-1" th:classappend="${correct} ? 'correct' : 'wrong'">
        <span class="q-mark" th:text="${correct} ? '✓ 正解' : '× 不正解'"></span>
        <p class="check-why" th:if="${!correct and choice >= 0 and choice < question.whyHtml.size() and !question.whyHtml.get(choice).isEmpty()}" th:utext="${question.whyHtml.get(choice)}"></p>
        <div class="explanation md" th:utext="${question.explanationHtml}"></div>
    </div>
    <a class="review-source" th:href="@{'/lessons/' + ${lesson.id} + '#quiz-q' + ${quizIndex}}"><span>出どころ: <b th:text="${lesson.title}"></b></span><span class="review-source-go">読み直す</span></a>
    <div class="review-next"><p class="review-note" th:text="${reviewLabel}"></p>
        <a class="btn primary" th:if="${retryNext == null}" th:href="@{/review}">次の復習へ</a>
        <a class="btn primary" th:if="${retryNext != null}" th:href="@{/review(retry=${retryNext})}" th:text="${retryLast} ? 'おわりの画面へ' : '次の解き直しへ'"></a></div>
    <th:block th:if="${retryNext == null}"><p th:replace="~{fragments/review-parts :: progress(${dueLeft}, ${todayCount}, true)}"></p></th:block>
</div>
</body>
</html>

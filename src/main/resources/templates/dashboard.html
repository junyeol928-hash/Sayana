<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ダッシュボード')}"></head>
<body class="page-dashboard">
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container">
<div class="dash-grid">
    <div class="dash-side">
        <section class="today" aria-labelledby="today-title" th:if="${nextLesson}">
            <p class="today-kicker"><span>今日の稽古</span><span th:text="${nextChapter}">第1章</span></p>
            <h1 class="today-title" id="today-title"><a th:href="@{/lessons/{id}(id=${nextLesson.id})}" th:text="${nextLesson.title}">レッスン</a></h1>
            <p class="today-meta"><span th:text="'読む ' + ${nextLesson.minutes} + ' 分'"></span><span th:text="'演習 ' + ${nextLesson.exercises.size()}"></span><span th:text="'クイズ ' + ${nextLesson.quiz.size()}"></span><span th:unless="${nextLesson.reading.isEmpty()}" th:text="'読解 ' + ${nextLesson.reading.size()}"></span></p>
            <p class="today-next" th:if="${nextHint != null}"><span class="dye" th:classappend="'dye-' + ${nextDye}"></span><span th:text="'いま ' + ${nextDyeName} + ' · ' + ${nextHint}"></span></p>
            <div class="today-actions"><a class="btn primary" th:href="@{/lessons/{id}(id=${nextLesson.id})}">稽古をはじめる</a></div>
            <a class="today-review" th:href="@{/review}"><span>今日の復習</span>
                <span th:if="${dueCount > 0}"><b th:text="${dueCount}">3</b>問 <svg class="icon sm" aria-hidden="true"><use href="#i-arrow"/></svg></span>
                <span th:if="${dueCount == 0}" class="zero" th:text="'今日はなし' + (${upcoming > 0} ? ' · この先 ' + ${upcoming} + ' 問' : '')"></span></a>
            <p class="talk-line" th:if="${streak == 0}">モカ先輩「まずは1レッスン、15分だけやってみよう」</p>
            <p class="talk-line" th:if="${streak > 0 and !studiedToday}" th:text="'モカ先輩「連続 ' + ${streak} + ' 日。今日もちょっとだけやって記録をつなごう」'"></p>
            <p class="talk-line" th:if="${streak > 0 and studiedToday}" th:text="'モカ先輩「今日もやったね。連続 ' + ${streak} + ' 日目」'"></p>
        </section>
        <section class="today" th:unless="${nextLesson}" aria-labelledby="today-title">
            <p class="today-kicker"><span>今日の稽古</span></p>
            <h1 class="today-title" id="today-title">全レッスン完了</h1>
            <p class="today-meta">あとは復習で、藍を褐まで深めていきましょう。</p>
            <a class="today-review" th:href="@{/review}"><span>今日の復習</span><span><b th:text="${dueCount}">0</b>問</span></a>
        </section>

        <section class="progress-block" aria-labelledby="dye-title">
            <div class="progress-head">
                <h2 id="dye-title">染まり具合</h2>
                <p>クイズ合格以上 <b th:text="${deepCount}">0</b> / <span th:text="${readyLessons}">55</span></p>
            </div>
            <div class="dye-strip" role="img"
                 th:attr="aria-label=${readyLessons} + ' レッスンの染まり具合。まだ ' + ${dyeCounts[0]} + '、読んだ ' + ${dyeCounts[1]} + '、クイズ合格 ' + ${dyeCounts[2]} + '、演習もできた ' + ${dyeCounts[3]} + '、復習をすべて卒業 ' + ${dyeCounts[4]}">
                <span th:each="ls : ${flatLessons}" class="dye" th:classappend="'dye-' + ${ls.dyeLevel()}" th:title="${ls.lesson.title} + ':' + ${ls.dyeLabel()}"></span>
            </div>
            <ul class="dye-legend">
                <li><span class="dye dye-0"></span><span><span class="dye-name-sm">生成り</span>まだ <span th:text="${dyeCounts[0]}"></span></span></li>
                <li><span class="dye dye-1"></span><span><span class="dye-name-sm">甕覗き</span>読んだ <span th:text="${dyeCounts[1]}"></span></span></li>
                <li><span class="dye dye-2"></span><span><span class="dye-name-sm">縹</span>クイズ合格 <span th:text="${dyeCounts[2]}"></span></span></li>
                <li><span class="dye dye-3"></span><span><span class="dye-name-sm">藍</span>演習もできた <span th:text="${dyeCounts[3]}"></span></span></li>
                <li><span class="dye dye-4"></span><span><span class="dye-name-sm">褐</span>復習をすべて卒業 <span th:text="${dyeCounts[4]}"></span></span></li>
            </ul>
            <div class="home-stats">
                <a th:href="@{/review}"><div class="stat-label">次の復習</div><div class="stat-value" th:text="${nextReview}">なし</div></a>
                <a th:href="@{/reading}"><div class="stat-label">読解の正解</div><div class="stat-value"><span id="reading-ok">0</span><small th:text="'/ ' + ${readingTotal}"></small></div></a>
                <div><div class="stat-label">この7日の稽古</div><div class="stat-value"><span th:text="${weekDays}">0</span><small>日</small></div></div>
            </div>
        </section>

        <section class="card heatmap-card" aria-labelledby="heat-title">
            <div class="card-title" id="heat-title">直近8週間の稽古</div>
            <div class="heatmap">
                <span th:each="d : ${days}" class="cell" th:classappend="'lv' + ${d.level()}"
                      th:title="${#temporals.format(d.day, 'M/d')} + ' : ' + ${d.actions} + ' 回'"></span>
            </div>
        </section>

        <section class="card weak" th:if="${!weakLessons.isEmpty()}" aria-labelledby="weak-title">
            <div class="card-title" id="weak-title">苦手レッスン</div>
            <ul class="weak-list">
                <li th:each="w : ${weakLessons}">
                    <a th:href="@{/lessons/{id}(id=${w.lesson.id})}" th:text="${w.lesson.title}"></a>
                    <span class="muted small" th:text="${#strings.listJoin(w.reasons, ' / ')}"></span>
                    <form class="inline" hx-post="/ai/generate" th:attr="hx-target='#weak-slot-' + ${w.lesson.id}" hx-disabled-elt="find button">
                        <input type="hidden" name="lessonId" th:value="${w.lesson.id}">
                        <button class="btn small" type="submit" th:disabled="${!aiAvailable}">類題を作る</button>
                        <span class="htmx-indicator muted small">作成中…</span>
                    </form>
                    <div th:id="'weak-slot-' + ${w.lesson.id}"></div>
                </li>
            </ul>
        </section>
    </div>

    <div class="dash-main">
        <section class="curriculum" aria-label="レッスン一覧">
            <div class="part-block" th:each="pp, ps : ${parts}">
                <div class="part-tag" aria-hidden="true" th:text="${ps.index == 0 ? '第一部' : (ps.index == 1 ? '第二部' : (ps.index == 2 ? '第三部' : '第四部'))}">第一部</div>
                <div>
                    <h2 class="part-title" th:text="${pp.part.title}">第1部</h2>
                    <p class="part-desc" th:text="${pp.part.description}"></p>
                    <th:block th:each="cp : ${pp.chapters}">
                        <h3 class="chapter-name"><span th:text="${cp.chapter.title}"></span><span th:text="${cp.completed()} + '/' + ${cp.lessons.size()}"></span></h3>
                        <ul class="lesson-rows">
                            <li th:each="ls : ${cp.lessons}" class="lesson-row"
                                th:classappend="${(nextLesson != null and ls.lesson.id == nextLesson.id) ? 'is-next' : ''} + ' ' + ${ls.lesson.ready() ? '' : 'planned'}">
                                <a th:href="@{/lessons/{id}(id=${ls.lesson.id})}">
                                    <span class="dye" th:classappend="'dye-' + ${ls.dyeLevel()}" role="img" th:attr="aria-label=${ls.dyeLabel()}"></span>
                                    <span class="row-title"><b th:if="${nextLesson != null and ls.lesson.id == nextLesson.id}">今日の稽古</b><span th:text="${ls.lesson.title}"></span></span>
                                    <span class="row-meta" th:if="${ls.lesson.ready()}">
                                        <span th:if="${ls.bestQuiz != null}" th:text="'クイズ ' + ${ls.bestQuiz} + '/' + ${ls.quizTotal}"></span>
                                        <span th:if="${ls.bestQuiz == null}" th:text="${ls.lesson.minutes} + '分'"></span>
                                    </span>
                                    <span class="row-meta" th:unless="${ls.lesson.ready()}">準備中</span>
                                </a>
                            </li>
                        </ul>
                    </th:block>
                </div>
            </div>
        </section>

        <section class="card" th:if="${!recentSubmissions.isEmpty()}" aria-labelledby="recent-title">
            <div class="card-title"><span id="recent-title">最近の提出</span> <a class="small" th:href="@{/history}">すべて見る</a></div>
            <table class="table">
                <tr th:each="s : ${recentSubmissions}">
                    <td class="small muted" th:text="${ui.shortTime(s.createdAt)}"></td>
                    <td th:text="${lessonTitles.get(s.lessonId)} ?: ${s.lessonId}"></td>
                    <td><a th:href="@{/history/{id}(id=${s.id})}" th:text="${s.exerciseTitle}"></a></td>
                    <td><span class="pill" th:classappend="${s.passed} ? 'ok' : 'ng'" th:text="${s.passed} ? '合格' : '不合格'"></span></td>
                    <td class="small"><span th:if="${s.aiReview != null}">講評あり</span></td>
                </tr>
            </table>
        </section>
    </div>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

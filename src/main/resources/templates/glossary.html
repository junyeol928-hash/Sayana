<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('用語集')}"></head>
<body class="page-glossary">
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container">
    <h1 class="page-title">用語集</h1>
    <p class="page-lead">全レッスンの用語 <span th:text="${terms.size()}">405</span> 語を読み順に。読み・英語・説明のどれでも探せます。同じ用語はレッスンごとの説明が並びます。</p>
    <div class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="glossary-q" placeholder="例: Bean、ちゅうにゅう、injection" aria-label="用語を探す" autocomplete="off"></div>
    <p class="glossary-count" id="glossary-count" aria-live="polite"></p>
    <ul class="term-list" id="terms">
        <th:block th:each="t, ts : ${terms}">
        <li class="term-group" th:if="${ts.index == 0 or rows[ts.index] != rows[ts.index - 1]}"><h2 th:text="${rows[ts.index]}">あ行</h2></li>
        <li class="term">
            <p class="term-name"><span th:text="${t.term}"></span><small th:if="${t.read != null}" th:text="${t.read}"></small><small lang="en" th:if="${t.en != null}" th:text="${t.en}"></small></p>
            <p class="term-def" th:utext="${t.defHtml}"></p>
            <a class="term-from" th:if="${t.lessonId != null}" th:href="@{/lessons/{id}(id=${t.lessonId})}" th:text="${lessonTitles.get(t.lessonId)}"></a>
        </li>
        </th:block>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

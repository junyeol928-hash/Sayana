<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${view.exercise.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container narrow">
    <nav class="breadcrumb">
        <a th:href="@{/}">ホーム</a> ›
        <a th:if="${lesson}" th:href="@{/lessons/{id}(id=${lesson.id})} + '#more'" th:text="${lesson.title}"></a> › 類題
    </nav>
    <p class="muted small">AIが作った類題です(模範解答が採点テストに合格することは確認済み)。
        <span id="editor-keys-practice" data-editor-help>編集欄の中の <kbd>Tab</kbd> は字下げ。外へ出るときは <kbd>Esc</kbd> のあと <kbd>Tab</kbd>。</span></p>
    <article th:replace="~{fragments/exercise :: card(${view})}"></article>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
